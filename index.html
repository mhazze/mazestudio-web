     en SmoothScroll() devuelve early si window.ScrollSmoother es undefined. -->
<script>
  // framer-motion expone su API como window.Motion (algunos builds: window.FramerMotion)
  if (!window.Motion && window.FramerMotion) window.Motion = window.FramerMotion;
  // Red de seguridad: si el CDN de framer-motion falla, definimos un "motion"
  // degradado que renderiza el elemento normal (sin animación) para que la web
  // NO se quede en blanco. En carga normal este bloque se omite.
  if (window.React && (!window.Motion || !window.Motion.motion)) {
    var MZ_ANIM = {initial:1,animate:1,exit:1,whileInView:1,whileHover:1,whileTap:1,whileFocus:1,whileDrag:1,viewport:1,transition:1,variants:1,layout:1,layoutId:1,drag:1,onUpdate:1,custom:1};
    var MZ_CACHE = {};
    var mzEl = function(tag){
      if (MZ_CACHE[tag]) return MZ_CACHE[tag];
      var C = window.React.forwardRef(function(props, ref){
        var clean = {};
        for (var k in props){ if (k !== 'children' && !MZ_ANIM[k]) clean[k] = props[k]; }
        if (ref) clean.ref = ref;
        return window.React.createElement(tag, clean, props.children);
      });
      MZ_CACHE[tag] = C;
      return C;
    };
    var mzMotion = (typeof Proxy !== 'undefined')
      ? new Proxy({}, { get: function(_, tag){ return mzEl(tag); } })
      : {};
    window.Motion = window.Motion || {};
    window.Motion.motion = window.Motion.motion || mzMotion;
    window.Motion.MotionConfig = window.Motion.MotionConfig || function(props){ return props.children; };
  }
  if (window.gsap && window.ScrollTrigger) window.gsap.registerPlugin(window.ScrollTrigger);
</script>

    "info@mazestudio.site · respondemos en 24 h": "info@mazestudio.site · we reply within 24 h",
    "© 2026 Mazestudio · estudio de automatización con IA · Tenerife": "© 2026 Mazestudio · AI automation studio · Tenerife",
    "Última actualización": "Last updated",
    "Aviso legal": "Legal notice",
    "Privacidad": "Privacy",

    /* catálogo de servicios (PDF) */
    "Descargar catálogo de servicios (PDF)": "Download services catalogue (PDF)",
    "Catálogo de servicios": "Services catalogue",
    "Qué automatizamos, cómo trabajamos y qué recibes. PDF, sin dejar tus datos.": "What we automate, how we work and what you get. PDF, no form to fill in.",
    "// catálogo de servicios": "// services catalogue",
    "descarga directa, sin formulario": "direct download, no form",
    "Descargar el catálogo": "Download the catalogue",
    "Preparando la descarga…": "Preparing your download…",
    "Catálogo descargado": "Catalogue downloaded",
  };

  /* PDF del catálogo según idioma (los dos ficheros viven en publicado/docs/) */
  window.CATALOGO_PDF = (lang === 'en')
    ? 'docs/mazestudio-services-catalogue.pdf'
    : 'docs/mazestudio-catalogo-servicios.pdf';

  window.t = function(es){
    if (window.MS_LANG !== 'en') return es;
    var en = window.I18N_EN[es];
    return (en === undefined) ? es : en;
  };
  window.fmtNum = function(n){
    return Math.round(n).toLocaleString(window.MS_LANG === 'en' ? 'en-US' : 'es-ES');
  };

  /* El <head> de /en ya viene en inglés en el HTML (lo genera build.mjs), así
     que no hay que parchearlo por JS: un <title> que solo existe después de
     ejecutar JS no lo ve ningún crawler sin JS. Se deja el parcheo únicamente
     como red de seguridad si alguna vez se sirviera /en sin pasar por build. */
  if (lang === 'en' && /Automatización/.test(document.title)) {
    document.title = window.t("Mazestudio · Automatización con IA en Tenerife");
    var metaDesc = document.querySelector('meta[name="description"]');
    if (metaDesc) metaDesc.setAttribute('content', window.t(metaDesc.getAttribute('content')));
  }
})();
</script>

<!-- ══════════════════════════════════════════════════════════════
     DESIGN SYSTEM · paleta "midnight violet" (web_06.jpg)
     base violeta-noche · acento azul luminoso del cubo-laberinto
     ══════════════════════════════════════════════════════════════ -->
<style>
:root{
  /* tokens de marca (web_06.jpg) */
  --vacio:#030306; --abismo:#12101A; --penumbra:#1E1D2C; --pizarra:#302E3C;
  --grafito:#403B47; --niebla:#8D8C9A; --ceniza:#A6A5B3; --luz:#EAE8F2;
  --pulso:#4B8CF7; --pulso-hondo:#1E4FAF;
  /* derivados semánticos */
  --bg:#0B0A12; --bg-deep:#08070C; --surface:#1E1D2C;
  --ink:#EAE8F2; --ink-mut:#C1C0CD;
  --accent:#4B8CF7; --accent-deep:#1E4FAF; --accent-soft:#8FB6FF;
  --accent-wash:rgba(75,140,247,.12);
  --line:rgba(234,232,242,.07); --line-2:rgba(234,232,242,.14);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
/* Recorte horizontal con CLIP en html y body — nunca hidden. Los decorativos
   que sobresalen (fx-glow, ba-halo) expandían el viewport de layout en móvil
   y la nav fija dejaba el burger fuera de pantalla: lo contiene el clip de
   body (recorta el contenido sin crear contenedor de scroll). Con hidden,
   body se volvía scroller propio (html≠visible corta la propagación al
   viewport) y su overscroll-behavior BLOQUEABA la rueda y el táctil — el
   overscroll va por eso en html, que es quien gobierna el viewport. */
html{scroll-behavior:auto;overflow-x:clip;overscroll-behavior:none;}
body{background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:clip;}
a{text-decoration:none;color:inherit;}
::selection{background:rgba(75,140,247,.32);color:#fff;}

/* atmósfera violeta bajo las secciones de contenido */
body{
  background:
    radial-gradient(1100px 720px at 90% -2%,  rgba(75,140,247,.12), transparent 58%),
    radial-gradient(900px 680px at -6% 26%,    rgba(99,80,170,.10), transparent 55%),
    radial-gradient(1000px 760px at 106% 64%,  rgba(75,140,247,.09), transparent 58%),
    radial-gradient(900px 700px at 16% 96%,    rgba(99,80,170,.08), transparent 60%),
    linear-gradient(180deg,#0B0A12 0%,#0E0C18 26%,#0B0A12 54%,#0C0A14 78%,#050409 100%);
}
section[id]{scroll-margin-top:96px;}

/* ── liquid glass (hero) ── */
.lg{ background:rgba(255,255,255,.015);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.12);position:relative;overflow:hidden; }
.lg::before{ content:"";position:absolute;inset:0;border-radius:inherit;padding:1.4px;
  background:linear-gradient(180deg,rgba(255,255,255,.45) 0%,rgba(255,255,255,.15) 20%,
    rgba(255,255,255,0) 40%,rgba(255,255,255,0) 60%,rgba(255,255,255,.15) 80%,rgba(255,255,255,.45) 100%);
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none; }
.lg-s{ background:rgba(255,255,255,.015);backdrop-filter:blur(50px);-webkit-backdrop-filter:blur(50px);
  box-shadow:4px 4px 8px rgba(0,0,0,.1),inset 0 1px 1px rgba(255,255,255,.18);position:relative;overflow:hidden; }
.lg-s::before{ content:"";position:absolute;inset:0;border-radius:inherit;padding:1.4px;
  background:linear-gradient(180deg,rgba(255,255,255,.5) 0%,rgba(255,255,255,.2) 20%,
    rgba(255,255,255,0) 40%,rgba(255,255,255,0) 60%,rgba(255,255,255,.2) 80%,rgba(255,255,255,.5) 100%);
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none; }
.nav-link:hover{background:rgba(255,255,255,.08)!important;}
body.demo-open nav{opacity:0!important;pointer-events:none!important;transition:opacity .2s;}

/* fade-in del vídeo del hero: solo entra cuando ha arrancado a reproducirse
   de verdad (clase .is-playing, puesta por JS en el evento 'playing'). Si el
   autoplay no arranca —Low Power Mode, Data Saver, reduced-motion— el vídeo
   se queda invisible y debajo asoma el póster estático: limpio, sin vídeo
   pausado ni botón de play nativo encima */
@keyframes heroVideoIn{from{opacity:0;}to{opacity:1;}}
.hero-fade.is-playing{animation:heroVideoIn 1100ms ease forwards;}
/* fade-in genérico para imágenes de fondo sueltas (no ligadas al estado de
   reproducción de un vídeo): mismo keyframe, siempre se dispara al montar */
.img-fade-in{animation:heroVideoIn 1100ms ease forwards;}

/* oculta el botón de play que Chrome/Android superpone a cualquier <video>
   mientras aún no ha arrancado a reproducirse (aparece incluso sin el
   atributo controls, durante el buffering del autoplay muted en móvil) */
video::-webkit-media-controls-start-playback-button{display:none!important;-webkit-appearance:none;pointer-events:none;}
video::-webkit-media-controls{display:none!important;}

/* barra de progreso de scroll — escala por transform (composited), no por
   width: animar width relayouta la página en cada frame y en móvil da tirones */
.scroll-progress{position:fixed;top:0;left:0;height:3px;width:100%;z-index:120;
  background:linear-gradient(90deg,var(--pulso-hondo),var(--pulso) 55%,var(--accent-soft));
  box-shadow:0 0 14px rgba(75,140,247,.7);
  transform:scaleX(0);transform-origin:0 50%;will-change:transform;transition:transform .08s linear;}

/* ── layout base de sección ── */
.v2-sec{position:relative;z-index:1;padding:clamp(81.9px,12vh,140.7px) clamp(21px,6vw,84px);}
.v2-inner{max-width:1200px;margin:0 auto;}
.v2-kicker{font-family:'JetBrains Mono',monospace;font-size:13.6px;letter-spacing:.04em;color:var(--ceniza);margin-bottom:18px;}
.v2-h2{font-family:'Bricolage Grotesque',sans-serif;color:#fff;font-size:clamp(35.7px,5.6vw,69.3px);line-height:.94;letter-spacing:-2px;}
.v2-h2 em,.v2-diag-result em{font-style:italic;background:linear-gradient(90deg,#8FB6FF,#4B8CF7 45%,#86E6FF);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  padding-right:.22em;margin-right:-.22em;}

/* ── HeadReveal «A + D + ignición» · máscara editorial + kicker decodificado ──
   El JS parte el h2 en palabras (.hr-wm > .hr-w) preservando el <em>. El
   gradiente pasa a vivir en cada palabra: un hijo con transform rompe el
   background-clip:text del padre. El padding + margen negativo de .hr-wm abre
   ventana a descendentes e itálicas sin alterar el interlineado. */
.hr-wm{display:inline-block;vertical-align:bottom;
  padding:.16em .08em .2em;margin:-.16em -.08em -.2em;}
.hr-w{display:inline-block;}
.hr-split em{background:none;-webkit-text-fill-color:currentColor;color:inherit;padding-right:0;margin-right:0;}
.hr-split em .hr-w{background:linear-gradient(90deg,#8FB6FF,#4B8CF7 45%,#86E6FF);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  padding-right:.22em;margin-right:-.22em;}
.hr-ignite{animation:hrIgnite 1.1s ease both;}
@keyframes hrIgnite{0%{filter:brightness(1);}
  40%{filter:brightness(1.8) drop-shadow(0 0 22px rgba(134,230,255,.85));}
  100%{filter:brightness(1);}}
.hr-caret::after{content:"▍";color:var(--accent-soft);animation:hrCaret .7s step-end infinite;}
@keyframes hrCaret{50%{opacity:0;}}

/* ── variante «C + D» (contorno→luz) · se activa con la estructura .hr-olh ──
   Dos copias del h2: base en trazo fino + relleno normal recortado por
   clip-path que GSAP barre de izquierda a derecha junto a la vertical de luz. */
.hr-olh{position:relative;}
.hr-olbase{color:transparent;-webkit-text-stroke:1.1px rgba(234,232,242,.3);}
.hr-olbase em{background:none;-webkit-text-fill-color:transparent;color:transparent;
  -webkit-text-stroke:1.1px rgba(143,182,255,.5);}
.hr-olfill{position:absolute;inset:0;}
.hr-olbeam{position:absolute;top:-14%;bottom:-14%;left:-2%;width:3px;border-radius:3px;opacity:0;
  background:linear-gradient(180deg,transparent,rgba(143,182,255,.9),transparent);
  box-shadow:0 0 26px 4px rgba(75,140,247,.55);pointer-events:none;}
@media(prefers-reduced-motion:reduce){.hr-olbase{visibility:hidden;}}
.v2-note{margin-top:18px;color:rgba(234,232,242,.66);max-width:54ch;font-family:'Inter';font-weight:300;font-size:clamp(15.7px,1.4vw,17.8px);line-height:1.55;}

/* glows parallax decorativos */
.fx-glow{position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none;z-index:0;opacity:.6;will-change:transform;}

/* ── botones ── */
.v2-btn{font-family:'Inter';font-size:15.3px;font-weight:500;display:inline-flex;align-items:center;gap:8px;
  padding:13px 22px;border-radius:9999px;cursor:pointer;min-height:46px;text-align:center;
  transition:transform .18s,background .18s,box-shadow .18s,border-color .18s;}
.v2-btn-accent{background:var(--accent);color:#fff;border:1px solid var(--accent);box-shadow:0 12px 30px -12px var(--accent);}
.v2-btn-accent:hover{background:var(--accent-deep);transform:translateY(-2px);box-shadow:0 18px 40px -14px var(--accent);}
.v2-btn-ghost{background:transparent;color:#fff;border:1px solid var(--line-2);}
.v2-btn-ghost:hover{background:rgba(255,255,255,.06);border-color:var(--accent-soft);}
.v2-btn-white{background:#fff;color:#0B0A12;border:1px solid #fff;}
.v2-btn-white:hover{transform:translateY(-2px);box-shadow:0 14px 32px -14px rgba(255,255,255,.4);}

/* grid de 3 */
.v2-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
@media(max-width:980px){.v2-grid-3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:600px){.v2-grid-3{grid-template-columns:1fr;}}

/* ═══ ANTES / DESPUÉS · el interruptor ═══
   Una sola lista de tareas y un conmutador «a mano ↔ en automático»:
   cada fila gira (split-flap) y el problema se convierte en beneficio.
   El estado vive en la clase .is-after del propio <section>. */
.ba-halo{position:absolute;left:50%;bottom:-10%;width:900px;height:600px;transform:translateX(-50%);
  background:radial-gradient(ellipse at center,rgba(75,140,247,.32),transparent 65%);
  filter:blur(30px);pointer-events:none;opacity:0;transition:opacity 1s;}
.is-after .ba-halo{opacity:1;}
.ba-switch{position:relative;display:grid;grid-template-columns:1fr 1fr;align-items:stretch;
  width:min(420px,92vw);border:1px solid var(--line-2);border-radius:9999px;padding:5px;cursor:pointer;
  background:rgba(12,11,18,.78);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  font-family:'JetBrains Mono',monospace;font-size:12.6px;letter-spacing:.08em;text-transform:uppercase;
  color:inherit;transition:border-color .5s,box-shadow .5s;}
.is-after .ba-switch{border-color:rgba(75,140,247,.5);box-shadow:0 0 40px -16px rgba(75,140,247,.8);}
.ba-thumb{position:absolute;top:5px;bottom:5px;left:5px;width:calc(50% - 5px);border-radius:9999px;
  background:rgba(255,255,255,.09);border:1px solid var(--line-2);
  transition:transform .55s cubic-bezier(.3,1.2,.35,1),background .55s,border-color .55s,box-shadow .55s;}
.is-after .ba-thumb{transform:translateX(100%);
  background:linear-gradient(135deg,var(--accent),var(--accent-deep));
  border-color:var(--accent);box-shadow:0 0 24px -6px var(--accent);}
.ba-opt{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 10px;color:var(--niebla);transition:color .4s;white-space:nowrap;}
.ba-opt.o-before{color:#fff;}
.is-after .ba-opt.o-before{color:var(--niebla);}
.is-after .ba-opt.o-after{color:#fff;}
.ba-ico{font-size:11px;opacity:.85;}
.ba-hint{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--ceniza);margin-top:14px;transition:opacity .6s;}
.ba-hint.off{opacity:0;}
.ba-panel{position:relative;width:min(880px,100%);margin-top:clamp(30px,5vh,48px);
  border:1px solid var(--line-2);border-radius:24px;padding:26px clamp(18px,3.5vw,34px) 18px;overflow:hidden;
  background:rgba(12,11,18,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  transition:border-color .7s,box-shadow .7s,background .7s;}
.is-after .ba-panel{border-color:rgba(75,140,247,.5);box-shadow:0 0 60px -24px rgba(75,140,247,.8);
  background:linear-gradient(150deg,rgba(75,140,247,.15),rgba(12,11,18,.85));}
/* barrido de luz al encender el modo automático */
.ba-panel::after{content:"";position:absolute;top:0;bottom:0;left:-40%;width:34%;pointer-events:none;
  background:linear-gradient(100deg,transparent,rgba(143,182,255,.13),transparent);
  transform:skewX(-14deg);opacity:0;}
.ba-panel.sweep::after{animation:baSweep 1s ease-out .15s;}
@keyframes baSweep{0%{left:-40%;opacity:0;}15%{opacity:1;}100%{left:115%;opacity:0;}}
.ba-tags{position:relative;height:16px;margin-bottom:10px;font-family:'JetBrains Mono',monospace;
  font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;}
.ba-tags span{position:absolute;left:0;top:0;transition:opacity .5s;}
.ba-tag-before{color:rgba(255,255,255,.45);}
.ba-tag-after{color:var(--accent-soft);opacity:0;}
.is-after .ba-tag-before{opacity:0;}
.is-after .ba-tag-after{opacity:1;}
.ba-row{border-bottom:1px solid var(--line);perspective:900px;}
.ba-row:last-child{border-bottom:none;}
.ba-flip{display:grid;transform-style:preserve-3d;
  transition:transform .65s cubic-bezier(.25,.8,.3,1);transition-delay:var(--d,0s);}
.is-after .ba-flip{transform:rotateX(180deg);}
.ba-face{grid-area:1/1;display:flex;align-items:center;gap:14px;padding:17px 4px;
  font-family:'Inter';font-weight:300;font-size:clamp(15px,1.8vw,16.5px);line-height:1.4;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;}
.ba-face.f-before{color:rgba(255,255,255,.62);}
.ba-face.f-after{color:rgba(255,255,255,.92);transform:rotateX(180deg);}
.ba-x{flex:0 0 auto;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:11.5px;color:var(--niebla);border:1px solid var(--line-2);background:rgba(255,255,255,.03);}
.ba-check{flex:0 0 auto;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--accent);box-shadow:0 0 10px -2px var(--accent);}
.ba-247{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.1em;
  color:#9fd8ff;border:1px solid rgba(134,230,255,.35);border-radius:9999px;padding:3px 10px;white-space:nowrap;
  text-shadow:0 0 12px rgba(134,230,255,.5);}
@media(max-width:600px){
  .ba-face{padding:15px 2px;gap:11px;}
  .ba-247{display:none;}
  /* en móvil (varios navegadores/webviews) backface-visibility falla y las dos
     frases del flip 3D quedan superpuestas; en vez de girar, cross-fade plano */
  .is-after .ba-flip{transform:none;}
  .ba-face{transition:opacity .4s ease,visibility 0s linear;}
  .ba-face.f-after{transform:none;opacity:0;visibility:hidden;}
  .ba-face.f-before{opacity:1;visibility:visible;}
  .is-after .ba-face.f-before{opacity:0;visibility:hidden;}
  .is-after .ba-face.f-after{opacity:1;visibility:visible;}
}
@media(prefers-reduced-motion:reduce){
  .ba-flip,.ba-thumb,.ba-panel,.ba-switch,.ba-tags span,.ba-halo{transition:none;}
  .ba-panel.sweep::after{animation:none;}
}

/* ═══ EL PANEL · CRM centralizado embebido en vivo ═══ */
.lr-sec{position:relative;z-index:1;padding:clamp(73.5px,12vh,126px) clamp(21px,6vw,84px);overflow:hidden;}
.lr-inner{max-width:1200px;margin:0 auto;text-align:center;position:relative;z-index:1;}
.lr-kicker{font-family:'JetBrains Mono',monospace;font-size:12.6px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent-soft);}
.lr-title{font-family:'Bricolage Grotesque',sans-serif;font-weight:400;color:#fff;letter-spacing:-2px;line-height:1.02;
  font-size:clamp(31.5px,5vw,60.9px);margin:18px auto 4px;max-width:18ch;}
.lr-title em{font-style:italic;background:linear-gradient(90deg,#8FB6FF,#4B8CF7 45%,#86E6FF);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  padding-right:.22em;margin-right:-.22em;}
/* el padding-right de arriba abre hueco al voladizo de la cursiva, pero por
   defecto (box-decoration-break:slice) solo se lo lleva el ÚLTIMO fragmento:
   si el <em> parte en dos líneas, al primero se le corta la última letra
   (el gradiente no llega). clone da ese padding a cada fragmento. */
.lr-title em,.v2-h2 em,.v2-diag-result em,.dgr-gsub em{
  -webkit-box-decoration-break:clone;box-decoration-break:clone;}
.lr-note{margin:20px auto 0;max-width:62ch;font-size:16px;line-height:1.62;color:var(--ink-mut);font-weight:300;}
/* marco del panel embebido · la altura la manda la propia demo por postMessage */
.lr-app{position:relative;z-index:1;width:min(100%,1180px);margin:46px auto 0;overflow:hidden;
  border:1px solid var(--line-2);border-radius:22px;background:rgba(11,10,18,.55);
  box-shadow:0 60px 130px -55px rgba(0,0,0,.88),inset 0 1px 1px rgba(255,255,255,.07);}
.lr-app::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;z-index:2;
  background:linear-gradient(90deg,transparent,#86E6FF,transparent);opacity:.7;}
.lr-app iframe{display:block;width:100%;border:0;background:transparent;}
/* blobs de luz ambiental · oscilación lenta */
.lr-blob{position:absolute;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0;opacity:.55;will-change:transform;}
@keyframes lrFloat1{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(40px,-30px) scale(1.1);}}
@keyframes lrFloat2{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-46px,28px) scale(1.08);}}

/* ═══ MARQUEE · tus herramientas ═══ */
.mq-sec{position:relative;z-index:1;padding:8px 0 clamp(35.7px,6vh,58.8px);overflow:hidden;}
.mq-head{text-align:center;font-family:'JetBrains Mono',monospace;font-size:clamp(13px,1.4vw,16px);font-weight:500;
  letter-spacing:.12em;text-transform:uppercase;color:var(--luz);margin-bottom:26px;line-height:1.5;padding:0 18px;}
.mq-head .mk{color:var(--accent);opacity:.6;}
.mq-head em{font-style:normal;
  background:linear-gradient(90deg,#4B8CF7 0%,#86E6FF 38%,#fff 50%,#86E6FF 62%,#4B8CF7 100%);
  background-size:250% auto;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;color:transparent;

@keyframes mq-shine{to{background-position:250% center;}}
.mq-mask{position:relative;overflow:hidden;
  -webkit-mask:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent);

/* — biblioteca de demos · acordeón: cada automatización se abre al tocarla — */
.dgr-acc{margin-top:24px;display:flex;flex-direction:column;gap:10px;}
.dgr-acc-item{position:relative;border:1px solid var(--line-2);border-radius:16px;overflow:hidden;

.dgr-acc-item::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;z-index:2;

.dgr-acc-item.open{border-color:rgba(75,140,247,.42);background:linear-gradient(180deg,rgba(34,45,80,.6),rgba(15,15,24,.72));

.dgr-acc-head{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;

.dgr-acc-ic svg{width:25px;height:25px;display:block;}

.dgr-acc-name{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:18px;letter-spacing:-.02em;color:var(--ink);

.dgr-acc-dot{width:6px;height:6px;border-radius:50%;background:#34D399;flex-shrink:0;
  box-shadow:0 0 0 3px rgba(52,211,153,.14);animation:dpblink 2.4s ease-in-out infinite;}
.dgr-acc-item.soon .dgr-acc-name{color:var(--ceniza);}
.dgr-acc-time{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;color:rgba(234,232,242,.42);white-space:nowrap;}

  border:1px solid var(--line-2);color:var(--accent-soft);transition:transform .5s cubic-bezier(.16,1,.3,1),background .3s,border-color .3s;}
.dgr-acc-chev svg{width:13px;height:13px;display:block;}
.dgr-acc-item.open .dgr-acc-chev{transform:rotate(180deg);background:var(--accent-wash);border-color:rgba(75,140,247,.4);}
/* cuerpo desplegable — grid-rows 0fr→1fr = altura fluida sin medir en JS */

  opacity:0;transform:translateY(8px);transition:opacity .5s .12s ease,transform .5s .12s cubic-bezier(.16,1,.3,1);}
.dgr-acc-item.open .dgr-acc-desc{opacity:1;transform:none;}

  padding:12px 22px;border-radius:12px;background:var(--accent);box-shadow:0 12px 34px -12px rgba(75,140,247,.7);
  opacity:0;transform:translateY(8px);transition:opacity .5s .18s ease,transform .5s .18s cubic-bezier(.16,1,.3,1),background .25s,box-shadow .25s;}

}

.dp-badge-live{display:inline-flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:9.4px;letter-spacing:.15em;text-transform:uppercase;

  padding:4px 10px;border-radius:100px;background:rgba(255,255,255,.05);color:var(--ink-mut);border:1px solid var(--line-2);width:fit-content;}
.dpl-desc{margin-top:20px;font-size:16.5px;line-height:1.65;color:var(--ink-mut);max-width:42ch;}

.dp-btn{display:inline-flex;align-items:center;gap:13px;font-family:'Bricolage Grotesque',sans-serif;font-size:17px;font-weight:600;
  padding:16px 32px;border-radius:14px;background:var(--accent);color:#fff;border:none;cursor:pointer;
  transition:transform .2s,box-shadow .2s,background .2s;box-shadow:0 10px 38px -8px rgba(75,140,247,.65);

  background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent);animation:dpshimmer 5s ease-in-out 1.5s infinite;}

.dp-btn:hover{transform:translateY(-2px);box-shadow:0 14px 40px -8px rgba(75,140,247,.8);background:var(--accent-deep);}

  padding:13px 24px;border-radius:12px;background:rgba(255,255,255,.04);color:var(--ink-mut);border:1px solid var(--line);width:fit-content;cursor:not-allowed;}
/* sin el panel al lado, el riel se queda solo: se limita el ancho para que las

/* ═══ ROI · calculadora destacada ═══ */
.roi2-sec{position:relative;z-index:1;overflow:hidden;padding:clamp(88px,13vh,150px) clamp(21px,6vw,84px);}

@keyframes roi2Float{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(34px,-26px) scale(1.08);}}
.roi2-inner{position:relative;z-index:1;max-width:1180px;margin:0 auto;}

  animation:roi2pulse 5.5s ease-in-out infinite;}

/* controles */

.roi2-field:last-child{margin-bottom:0;}

.roi2-range{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:6px;outline:none;cursor:pointer;
  background:linear-gradient(90deg,var(--accent) 0,var(--accent) var(--p,50%),rgba(255,255,255,.1) var(--p,50%),rgba(255,255,255,.1) 100%);}

.roi2-range::-webkit-slider-thumb:hover{transform:scale(1.14);box-shadow:0 0 0 8px rgba(75,140,247,.24),0 5px 16px rgba(0,0,0,.5);}

.roi2-barlbl{display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:rgba(234,232,242,.5);margin-bottom:9px;}
.roi2-bar{height:10px;border-radius:6px;background:rgba(255,255,255,.06);overflow:hidden;}
.roi2-bar-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent-deep),var(--accent),var(--accent-soft));
  box-shadow:0 0 18px -2px var(--accent);transition:width 1s cubic-bezier(.16,1,.3,1);}

@media(max-width:860px){

/* ═══ CUADRANTES · quiénes somos + recursos de marca ═══ */
.qd-sec{position:relative;z-index:1;padding:clamp(60px,10vh,110px) clamp(21px,6vw,84px);}
.qd-grid{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;position:relative;}
.qd-cell{position:relative;padding:clamp(36px,4vw,64px) clamp(26px,3.4vw,54px);}
.qd-tr{border-left:1px solid var(--line-2);}
.qd-tl .v2-note{font-size:clamp(13.3px,1.05vw,14.7px);}
.qd-tl .pq-grid{grid-template-columns:repeat(2,1fr);gap:14px;margin-top:38px;}
.qd-tl .pq-card{padding:20px 18px;}
/* letras de «quiénes somos» (≈×0.91 sobre la base) */
.qd-tl .v2-kicker{font-size:12.4px;}
.qd-tl .pq-card h3{font-size:16.2px;}
.qd-tl .pq-card p{font-size:13.4px;}
.qd-anim{display:flex;align-items:center;justify-content:center;overflow:hidden;min-height:440px;}
.qd-cap{position:absolute;left:clamp(26px,3.4vw,54px);bottom:22px;margin:0;
  font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ceniza);}
.qd-cap-top{bottom:auto;top:24px;}
/* ── cubo de cristal 3D (objeto de marca) ── */
.cubo-halo{position:absolute;width:360px;height:360px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(75,140,247,.24),transparent 65%);filter:blur(30px);animation:cuboHalo 7s ease-in-out infinite;}
@keyframes cuboHalo{0%,100%{opacity:.65;}50%{opacity:1;}}
.cubo-scene{perspective:1100px;}
.cubo-img{display:block;width:clamp(250px,23vw,330px);height:auto;transform-style:preserve-3d;
  filter:drop-shadow(0 34px 60px rgba(3,3,8,.65)) drop-shadow(0 0 46px rgba(75,140,247,.28));
  animation:cuboSway 9s ease-in-out infinite;will-change:transform;}
@keyframes cuboSway{
  0%,100%{transform:translateY(-12px) rotateY(-9deg) rotateX(2.5deg);}
  50%{transform:translateY(12px) rotateY(9deg) rotateX(-2.5deg);}
}
@media(max-width:980px){
  .qd-grid{display:block;}
  /* el cubo de marca no se pierde: pasa a divisor compacto entre cuadrantes */
  .qd-tr.qd-anim{display:flex;flex-direction:column;gap:14px;min-height:0;padding:30px 0 10px;}
  .cubo-halo{width:250px;height:250px;}
  .cubo-img{width:clamp(180px,46vw,240px);}
  .qd-cap{position:static;}
  .qd-cell{padding:34px 0;border:none!important;}
  .qd-tl .pq-grid{grid-template-columns:repeat(2,1fr);}
}
@media(max-width:560px){.qd-tl .pq-grid{grid-template-columns:1fr;}}

/* ═══ FAQ · lista de preguntas frecuentes ═══
   Sin tarjeta/caja: líneas finas como el resto del sitio. El glifo «+» → «×»
   es el único indicador de estado (abierto/cerrado). */
.faq-list{margin-top:52px;border-top:1px solid var(--line-2);max-width:900px;}
.faq-item{position:relative;border-bottom:1px solid var(--line-2);}
.faq-item::before{content:'';position:absolute;left:-1px;top:0;bottom:0;width:2px;background:var(--accent);
  transform:scaleY(0);transform-origin:50% 50%;transition:transform .4s cubic-bezier(.16,1,.3,1);}
.faq-item.open::before{transform:scaleY(1);}
.faq-q{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:20px;width:100%;
  padding:24px 4px 24px 22px;cursor:pointer;}
.faq-tag{flex:0 0 auto;width:112px;font-family:'JetBrains Mono',monospace;font-size:11.5px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--accent-soft);opacity:.85;
  transition:opacity .25s,color .25s;}
.faq-item.open .faq-tag{color:#fff;opacity:1;}
.faq-question{flex:1 1 auto;font-family:'Bricolage Grotesque',sans-serif;font-weight:600;
  font-size:clamp(16.5px,1.9vw,20px);letter-spacing:-.01em;color:rgba(234,232,242,.88);
  transition:color .25s;}
.faq-item.open .faq-question,.faq-q:hover .faq-question{color:#fff;}
.faq-toggle{flex:0 0 auto;width:26px;height:26px;display:flex;align-items:center;justify-content:center;
  font-family:'JetBrains Mono',monospace;font-size:19px;color:var(--ceniza);
  transition:transform .4s cubic-bezier(.16,1,.3,1),color .25s;transform:rotate(0deg);}
.faq-item.open .faq-toggle{transform:rotate(45deg);color:var(--accent-soft);}
.faq-q:hover .faq-toggle{color:#fff;}
.faq-a-wrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s cubic-bezier(.16,1,.3,1);}
.faq-item.open .faq-a-wrap{grid-template-rows:1fr;}
.faq-a-inner{overflow:hidden;}
.faq-answer{font-family:'Inter';font-weight:300;font-size:15.3px;line-height:1.62;
  color:rgba(234,232,242,.72);max-width:62ch;padding:0 4px 26px 22px;}
@media(max-width:640px){
  .faq-q{gap:12px;padding:20px 4px 20px 16px;flex-wrap:wrap;}
  .faq-tag{width:auto;order:1;flex-basis:100%;}
  .faq-question{order:2;flex-basis:calc(100% - 46px);font-size:15.5px;}
  .faq-toggle{order:3;}
  .faq-answer{padding-left:16px;}
}
@media(prefers-reduced-motion:reduce){
  .faq-a-wrap,.faq-toggle,.faq-item::before{transition:none;}
}

/* ═══ FOOTER ═══ */
.v2-footer{position:relative;z-index:1;background:#06060A;border-top:1px solid var(--line);padding:54px clamp(21px,6vw,84px) 38px;}
.v2-footer .inner{max-width:1200px;margin:0 auto;}
.v2-footer .top{display:flex;justify-content:space-between;align-items:flex-start;gap:32px;flex-wrap:wrap;padding-bottom:32px;border-bottom:1px solid var(--line);}
.v2-footer nav{display:flex;gap:28px;flex-wrap:wrap;}
.v2-footer nav a{font-family:'Inter';font-size:14.7px;color:rgba(234,232,242,.6);transition:color .2s;}
.v2-footer nav a:hover{color:#fff;}
/* .5 y no .4 de opacidad: con .4 el texto componía #616067 sobre el #06060a
   del pie, o sea 3,25:1, por debajo del 4,5:1 que pide la WCAG a 11,5 px.
   Con .5 compone rgb(120,119,126) = 4,57:1. Afecta al copyright y a los tres
   enlaces legales, que son justo los que hay que poder leer. */
.v2-footer .bot{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;padding-top:24px;
  font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:.08em;color:rgba(234,232,242,.5);}
.v2-footer .legal{display:flex;gap:18px;flex-wrap:wrap;}
.v2-footer .legal a{color:rgba(234,232,242,.5);transition:color .2s;}
.v2-footer .legal a:hover{color:var(--accent-soft);}
/* enlace al catálogo en PDF */
.v2-footer nav a.f-pdf{display:inline-flex;align-items:center;gap:8px;color:rgba(234,232,242,.82);}
.v2-footer nav a.f-pdf:hover{color:#fff;}
.v2-footer nav a.f-pdf span{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.1em;
  color:var(--accent-soft);border:1px solid var(--line-2);border-radius:4px;padding:2px 6px;}
@media(max-width:768px){
  .v2-footer nav{gap:6px 22px;}
  .v2-footer nav a,.v2-footer .legal a{display:inline-block;padding:10px 2px;}

/* ═══ CTA final · botón principal + descarga del catálogo ═══ */
.cta-acciones{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;}
@media(max-width:560px){
  .cta-acciones{flex-direction:column;width:100%;max-width:380px;}
  .cta-acciones .v2-btn{width:100%;justify-content:center;text-align:center;}
}

/* ═══ Banda de descarga del catálogo · entre «Cómo funciona» y el ROI ═══
   Idea: el botón parte en dos una línea de sección (elemento que rompe la
   retícula) y, al pasar el ratón, una HOJA asoma por debajo — el documento
   saliendo de la ranura. Al pulsar, el propio botón confirma la descarga
   (el navegador la hace en silencio y el usuario se queda sin saber si fue). */
.dl-band{position:relative;z-index:2;padding:clamp(40px,8vh,86px) clamp(21px,6vw,84px) clamp(64px,10vh,112px);}
.dl-wrap{max-width:1120px;margin:0 auto;}
.dl-kicker{font-family:'JetBrains Mono',monospace;font-size:12.4px;letter-spacing:.05em;
  color:var(--niebla);text-align:center;margin:0 0 22px;}
.dl-kicker b{font-weight:400;color:var(--accent-soft);}

.dl-rule{display:flex;align-items:center;justify-content:center;gap:clamp(14px,3.5vw,40px);}
.dl-rule i{flex:1;height:1px;display:block;}
.dl-rule i:first-child{background:linear-gradient(90deg,transparent,var(--line-2));transform-origin:100% 50%;}
.dl-rule i:last-child {background:linear-gradient(270deg,transparent,var(--line-2));transform-origin:0 50%;}

/* El ancho mínimo va en el contenedor, no en el botón: las etiquetas de los 3
   estados miden distinto y, si el botón se dimensiona por su texto, cambia de
   tamaño al pulsarlo y arrastra las líneas de la retícula. */
.dl-slot{position:relative;flex:none;display:flex;min-width:min(348px,100%);}

/* las hojas que asoman por detrás del botón — dos, para que se lea «documento»
   y no «rectángulo»; la máscara las disuelve antes de tocar la sección de abajo */
.dl-sheet{position:absolute;left:50%;top:11px;width:112px;height:150px;margin-left:-56px;z-index:0;
  border-radius:7px;box-shadow:0 26px 46px -20px rgba(0,0,0,.85);
  opacity:0;transform:translateY(-6px);pointer-events:none;
  -webkit-mask-image:linear-gradient(180deg,#000 26%,rgba(0,0,0,0) 100%);
          mask-image:linear-gradient(180deg,#000 26%,rgba(0,0,0,0) 100%);
  transition:opacity .26s ease,transform .62s cubic-bezier(.16,1,.3,1);}
.dl-sheet-a{background:linear-gradient(172deg,#F7F6FB 0%,#DEDCE8 40%,#B3B0C6 100%);}
.dl-sheet-b{background:linear-gradient(172deg,#CFCDDD 0%,#A9A6BC 55%,#807DA0 100%);}
.dl-sheet .l{position:absolute;left:15px;height:4px;border-radius:2px;background:rgba(30,29,44,.15);}
.dl-sheet .l1{top:57px;width:72px;} .dl-sheet .l2{top:69px;width:56px;} .dl-sheet .l3{top:81px;width:64px;}
.dl-sheet .mk{position:absolute;left:15px;top:40px;width:26px;height:6px;border-radius:2px;background:var(--accent);}
.dl-slot:hover .dl-sheet-b,.dl-slot:focus-within .dl-sheet-b{opacity:.72;transform:translateY(21px) rotate(3.4deg);}
.dl-slot:hover .dl-sheet-a,.dl-slot:focus-within .dl-sheet-a{opacity:1;transform:translateY(38px) rotate(-2.6deg);transition-delay:.06s;}

.dl-btn{position:relative;z-index:1;isolation:isolate;overflow:hidden;
  flex:1;display:inline-flex;align-items:center;justify-content:center;gap:11px;
  padding:15px 26px;min-height:52px;border-radius:9999px;cursor:pointer;
  font-family:'Inter',sans-serif;font-size:16px;font-weight:500;letter-spacing:-.01em;color:#fff;
  background:linear-gradient(180deg,#1B1930 0%,#100E1B 100%);border:1px solid var(--line-2);
  box-shadow:0 18px 40px -22px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.07);
  transition:border-color .25s,box-shadow .25s,transform .18s;}
.dl-btn:hover{border-color:rgba(143,182,255,.62);
  box-shadow:0 26px 60px -24px rgba(75,140,247,.62),0 0 0 4px rgba(75,140,247,.1),
             inset 0 1px 0 rgba(255,255,255,.14);}
.dl-btn:active{transform:scale(.985);}
.dl-btn:focus-visible{outline:2px solid var(--accent-soft);outline-offset:3px;}

/* foco que sigue al cursor (--mx/--my) */
.dl-btn::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;opacity:0;transition:opacity .3s;
  background:radial-gradient(190px circle at var(--mx,50%) var(--my,50%),rgba(75,140,247,.32),transparent 72%);}
.dl-btn:hover::before{opacity:1;}
/* destello que viaja (NO es respiración: no hay escala en bucle) */
.dl-btn::after{content:"";position:absolute;top:0;bottom:0;width:36%;z-index:-1;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.14),transparent);
  transform:translateX(-170%);animation:dlSheen 6.5s cubic-bezier(.45,0,.2,1) 2.4s infinite;}
@keyframes dlSheen{0%{transform:translateX(-170%);}20%,100%{transform:translateX(380%);}}

/* relleno de confirmación al pulsar */
.dl-fill{position:absolute;inset:0;z-index:-1;border-radius:inherit;
  transform:scaleX(0);transform-origin:0 50%;transition:transform .3s ease;
  background:linear-gradient(90deg,var(--accent-deep),var(--accent));}
.dl-btn.is-yendo .dl-fill{transform:scaleX(1);transition:transform .9s cubic-bezier(.3,.7,.2,1);}
.dl-btn.is-listo .dl-fill{transform:scaleX(1);background:linear-gradient(90deg,rgba(75,140,247,.42),rgba(75,140,247,.2));}
.dl-btn.is-listo{border-color:rgba(143,182,255,.6);}
.dl-btn.is-yendo::after,.dl-btn.is-listo::after{animation:none;opacity:0;}

/* la flecha cae y vuelve a entrar por arriba */
.dl-ico{position:relative;width:18px;height:18px;flex:none;overflow:hidden;color:var(--accent-soft);
  transition:color .25s;}
.dl-btn:hover .dl-ico,.dl-btn.is-yendo .dl-ico,.dl-btn.is-listo .dl-ico{color:#fff;}
.dl-ico svg{position:absolute;left:0;top:0;transition:transform .5s cubic-bezier(.16,1,.3,1);}
.dl-ico svg+svg{transform:translateY(-115%);}
/* :not(.is-listo) — con el check hay UN solo svg y el :hover lo expulsaba del recuadro */
.dl-btn:hover:not(.is-listo) .dl-ico svg:first-child{transform:translateY(115%);}
.dl-btn:hover:not(.is-listo) .dl-ico svg+svg{transform:translateY(0);}
.dl-ico .ok{animation:dlOk .42s cubic-bezier(.16,1,.3,1) both;}
@keyframes dlOk{from{transform:scale(.35) rotate(-14deg);opacity:0;}to{transform:scale(1) rotate(0);opacity:1;}}

.dl-tag{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.12em;
  color:var(--accent-soft);border:1px solid rgba(143,182,255,.3);border-radius:4px;padding:3px 7px;
  transition:color .25s,border-color .25s,background .25s;}
.dl-btn:hover .dl-tag{color:#fff;border-color:rgba(255,255,255,.45);background:rgba(255,255,255,.08);}
.dl-btn.is-yendo .dl-tag,.dl-btn.is-listo .dl-tag{color:#fff;border-color:rgba(255,255,255,.5);}

@media(max-width:760px){
  .dl-slot{min-width:min(300px,100%);}
  .dl-btn{font-size:15px;padding:14px 20px;gap:9px;}
  .dl-tag{display:none;}
}
@media(max-width:520px){
  .dl-rule i{display:none;}
  .dl-slot{width:100%;max-width:360px;min-width:0;}
  .dl-band{padding-bottom:clamp(40px,7vh,64px);}
}
@media(hover:none){.dl-sheet{display:none;}}
@media(prefers-reduced-motion:reduce){
  .dl-btn::after{animation:none;opacity:0;}
  .dl-sheet,.dl-ico svg{transition:none;}
  .dl-slot:hover .dl-sheet,.dl-slot:focus-within .dl-sheet{opacity:0;}
  .dl-btn:hover .dl-ico svg:first-child,.dl-btn:hover .dl-ico svg+svg{transform:none;}
  .dl-btn:hover .dl-ico svg+svg{opacity:0;}
}

/* ── NAV responsive ── */
.v2nav-burger{display:none;}
@media(max-width:920px){
  .v2nav-links{display:none!important;}
  .v2nav-burger{display:flex!important;}
}
/* la píldora de enlaces se centra con el EJE DE LA WEB, no con el hueco que deja
   el flex: con `space-between` la marca (~218px) pesa mucho más que el toggle de
   idioma (~70px) y eso empujaba la píldora ~74px a la derecha del centro real.
   Se saca del flujo y se centra sobre el 50% del viewport (la nav es fixed, así
   que es su bloque contenedor). Solo ≥1100px: por debajo de ese ancho la píldora
   centrada pisaría la marca — ahí se deja el reparto por flex hasta que a 920px
   entra el burger. */
@media(min-width:1100px){
  .v2nav-links{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);}
}

/* ── botón de idioma (muy visible, arriba a la derecha) ── */
.lang-toggle{display:inline-flex;align-items:center;gap:6px;cursor:pointer;flex-shrink:0;
  font-family:'JetBrains Mono',monospace;font-size:11.6px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink);background:rgba(255,255,255,.03);border:1px solid var(--accent);border-radius:9999px;
  padding:8px 13px;line-height:1;box-shadow:0 0 0 3px var(--accent-wash);
  transition:background .2s ease,border-color .2s ease,color .2s ease,box-shadow .2s ease,transform .15s ease;}
.lang-toggle:hover{background:var(--accent);border-color:var(--accent);color:#fff;transform:translateY(-1px);box-shadow:0 9px 24px -8px var(--accent);}
.lang-toggle svg{flex:0 0 auto;width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.7;}
@media(max-width:920px){
  .lang-toggle{width:46px;height:46px;padding:0;justify-content:center;gap:0;}
  .lang-toggle-txt{display:none;}
}
/* pantallas muy estrechas (≤374px): la fila logo + idioma + burger mide ~349px
   con los tamaños normales — se compacta todo para que quepa hasta en 320px.
   !important porque los tamaños base van en estilos inline del JSX */
@media(max-width:374px){
  .v2nav{padding:0 12px!important;}
  .v2nav-brand{padding:8px 10px!important;gap:8px!important;}
  .v2nav-brand svg{width:58px;height:23px;}
  .v2nav-brand-txt{font-size:16px!important;}
  .v2nav-right{gap:8px!important;}
  .lang-toggle{width:40px;height:40px;}
  .v2nav-burger{width:40px!important;height:40px!important;}
}

/* hero responsive padding */
.hero-body{padding:110px clamp(21px,6vw,84px) 60px;}

/* ═══ HERO · titular de marca centrado ("Mazestudio" + canica) ═══ */
.hero-title{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;line-height:.94;
  letter-spacing:-.035em;font-size:clamp(58px,13vw,192px);color:#fff;white-space:nowrap;
  text-shadow:0 2px 40px rgba(0,0,0,.55),0 1px 4px rgba(0,0,0,.4);}
/* <430px el mínimo de 58px ya no cabe (la palabra mide ~313px a 58px):
   escala fina para que "Mazestudio." entre completa hasta en 320px */
@media(max-width:430px){
  .hero-title{font-size:clamp(40px,12.8vw,50px);}
}
/* SIN opacity:0 de base a propósito (4 ago 2026, 3ª iteración). Las dos
   rondas anteriores intentaron ganarle la carrera a un renderizador con
   presupuesto de tiempo ajustando milisegundos del preloader — pero medir
   ese presupuesto desde fuera resultó no ser fiable (mismo método, mismo
   URL, resultados distintos en runs consecutivos: --virtual-time-budget no
   es fiable contra red real). En vez de seguir afinando a ciegas, se quita
   la condición de carrera de raíz: el texto está SIEMPRE a opacity:1 —
   nunca puede fotografiarse invisible, pase lo que pase con los timers.
   El preloader (opaco, z-index 9999) ya lo tapa físicamente para quien SÍ
   ve la animación; que además se autoescondiera por su cuenta era
   redundante. La entrada sigue notándose (blur + desplazamiento, sin
   opacity), coreografiada por .hero-ready más abajo. */
.hero-title .hw{display:inline-block;line-height:1;}
/* la entrada arranca cuando el preloader termina (.hero-ready), no al montar
   el componente — si no, la coreografía entera se resuelve oculta detrás
   del preloader y el usuario nunca la ve */
.hero-ready .hero-title .hw{animation:heroLetterIn .9s cubic-bezier(.16,1,.3,1) both;
  animation-delay:calc(.2s + var(--i) * .045s);}
@keyframes heroLetterIn{from{filter:blur(16px);transform:translateY(.28em);}to{filter:blur(0);transform:translateY(0);}}

/* canica de cristal — sustituye el punto final de "Mazestudio."
   esfera de VIDRIO translúcida (no plástico opaco): brillo especular
   móvil + anillo fresnel brillante en el borde + tinte azul concentrado
   solo en el borde inferior + backdrop-filter que dejа entrever el
   vídeo de fondo a través del centro, como un cristal real. Tamaño de
   punto final auténtico y entrada rodando (2 vueltas completas) desde
   el borde derecho de la pantalla hasta su posición final, lenta y sin
   caída ni rebote. */
.hero-marble{display:inline-block;width:.23em;height:.23em;margin-left:.05em;
  border-radius:50%;vertical-align:baseline;line-height:1;position:relative;
  background:
    radial-gradient(circle at 30% 23%,rgba(255,255,255,1) 0%,rgba(255,255,255,.95) 4%,rgba(255,255,255,0) 9%) no-repeat,
    radial-gradient(circle at 32% 26%,rgba(255,255,255,.98) 0%,rgba(255,255,255,.65) 9%,rgba(255,255,255,0) 28%) no-repeat,
    radial-gradient(circle at 42% 36%,rgba(255,255,255,.32) 0%,rgba(255,255,255,0) 42%) no-repeat,
    radial-gradient(circle at 50% 50%,transparent 74%,rgba(255,255,255,.86) 82%,rgba(226,236,255,.65) 88%,rgba(168,198,255,.24) 94%,transparent 100%),
    radial-gradient(circle at 68% 76%,rgba(75,140,247,.26) 0%,rgba(75,140,247,.09) 34%,rgba(75,140,247,.02) 58%,transparent 74%),
    radial-gradient(circle at 50% 50%,rgba(238,245,255,.26) 0%,rgba(210,224,250,.08) 60%,rgba(130,160,215,.1) 100%);
  background-size:32% 32%,50% 50%,64% 64%,100% 100%,100% 100%,100% 100%;
  background-position:30% 23%,32% 26%,42% 36%,0 0,0 0,0 0;
  background-repeat:no-repeat;
  backdrop-filter:blur(1px) brightness(1.22) saturate(1.35) contrast(1.1);
  -webkit-backdrop-filter:blur(1px) brightness(1.22) saturate(1.35) contrast(1.1);
  box-shadow:
    inset -.045em -.055em .07em rgba(8,16,40,.5),
    inset .03em .04em .045em rgba(255,255,255,.6),
    inset 0 0 0 .012em rgba(255,255,255,.4),
    0 .018em .07em rgba(75,140,247,.4);
  filter:drop-shadow(0 0 3px rgba(75,140,247,.55)) drop-shadow(0 0 7px rgba(75,140,247,.2));
  opacity:0;
}
.hero-ready .hero-marble{
  animation:
    heroMarbleIn 2.1s cubic-bezier(.16,1,.3,1) calc(.2s + var(--i) * .045s) both,
    heroMarbleSheen 6.5s ease-in-out infinite calc(2.3s + var(--i) * .045s);
}
@keyframes heroMarbleIn{
  0%{opacity:0;transform:translateX(50vw) scale(.6) rotate(0deg);filter:blur(5px) drop-shadow(0 0 0 rgba(75,140,247,0));}
  60%{opacity:1;filter:blur(0) drop-shadow(0 0 3px rgba(75,140,247,.5)) drop-shadow(0 0 7px rgba(75,140,247,.18));}
  100%{opacity:1;transform:translateX(0) scale(1) rotate(-720deg);filter:blur(0) drop-shadow(0 0 3px rgba(75,140,247,.55)) drop-shadow(0 0 7px rgba(75,140,247,.2));}
}
@keyframes heroMarbleSheen{
  0%,100%{background-position:30% 23%,32% 26%,42% 36%,0 0,0 0,0 0;}
  50%{background-position:38% 29%,40% 32%,48% 42%,0 0,0 0,0 0;}
}

.hero-sub{margin-top:22px;max-width:1000px;font-family:'Bricolage Grotesque',sans-serif;font-weight:300;
  font-size:clamp(33px,3.8vw,44px);line-height:1.25;color:rgba(255,255,255,.86);
  text-shadow:0 1px 16px rgba(0,0,0,.55);}
/* en bloque: el corte de línea cae entre las dos mitades de la frase,
   no en medio de "de IA" ni de "en Tenerife" */
.hero-sub-accent{display:block;font-size:1.16em;font-weight:500;
  background:linear-gradient(90deg,#8FB6FF,#4B8CF7 45%,#86E6FF);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  text-shadow:none;filter:drop-shadow(0 0 18px rgba(75,140,247,.45));}
@keyframes heroRise{from{filter:blur(8px);transform:translateY(18px);}to{filter:blur(0);transform:translateY(0);}}

.hero-cta-row{display:flex;align-items:center;justify-content:center;margin-top:38px;}
.hero-ready .hero-sub{animation:heroRise .8s cubic-bezier(.16,1,.3,1) .95s both;}
.hero-ready .hero-cta-row{animation:heroRise .8s cubic-bezier(.16,1,.3,1) 1.15s both;}

/* CTA único "Solicita tu auditoría gratis" — anillo de degradado giratorio (misma
   técnica de máscara que .lg, animada) + cristal con spot que sigue al
   cursor + botón magnético (misma fórmula que .magnetic: translate * .22/.3) */
@property --ring-angle{ syntax:'<angle>'; inherits:false; initial-value:0deg; }

.btn-glow{pointer-events:auto;position:relative;display:inline-block;border-radius:9999px;
  isolation:isolate;transition:transform .5s cubic-bezier(.16,1,.3,1);will-change:transform;}

.btn-glow::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1.6px;pointer-events:none;
  background:conic-gradient(from var(--ring-angle),
    rgba(75,140,247,0) 0deg, rgba(143,182,255,.95) 45deg, rgba(75,140,247,.12) 120deg,
    rgba(75,140,247,0) 190deg, rgba(75,140,247,0) 258deg, rgba(134,230,255,.9) 315deg, rgba(75,140,247,0) 360deg);
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  animation:btnRingSpin 6s linear infinite;}
@keyframes btnRingSpin{to{--ring-angle:360deg;}}

.btn-glow-face{position:relative;z-index:1;display:inline-flex;align-items:center;gap:10px;
  font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:17px;color:#fff;
  padding:17px 34px 17px 38px;border-radius:9999px;overflow:hidden;
  background:
    radial-gradient(150px circle at var(--mx,50%) var(--my,28%),rgba(255,255,255,.2),transparent 62%),
    linear-gradient(100deg,rgba(75,140,247,.3),rgba(75,140,247,.1) 55%,rgba(20,19,32,.6));
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.14),0 16px 44px -18px rgba(75,140,247,.85);
  transition:box-shadow .35s ease;}
.btn-glow:hover .btn-glow-face{box-shadow:inset 0 1px 1px rgba(255,255,255,.2),0 22px 58px -16px rgba(75,140,247,1);}

.btn-glow-arrow{display:inline-flex;color:var(--accent-soft);transition:transform .45s cubic-bezier(.16,1,.3,1),color .3s ease;}
.btn-glow:hover .btn-glow-arrow{transform:translate(3px,-3px);color:#fff;}

@media(max-width:560px){
  .btn-glow-face{font-size:15px;padding:14px 26px 14px 30px;gap:8px;}
}

@media(max-width:860px){
  /* los blobs de fondo (blur 80-90px) animados en bucle cargan la GPU del
     móvil mientras se scrollea; quietos son indistinguibles (deriva de 40px/15s) */
  .lr-blob,.roi2-blob{animation:none!important;}
}

/* ── móvil: titulares y números más comedidos ──
   los floors de los clamp() se pensaron para no quedarse minúsculos, pero en
   pantallas pequeñas ese floor domina toda la pantalla; aquí se bajan solo
   los más grandes (título de sección, cifra del ROI) sin tocar desktop */
@media(max-width:640px){
  .lr-title{font-size:clamp(26px,7.5vw,34px)!important;}
  #servicios h2{font-size:clamp(32px,8vw,44px)!important;}
  .v2-h2{font-size:clamp(28px,7vw,38px)!important;}
  .roi2-big{font-size:clamp(38px,10vw,54px)!important;}
}

/* ── táctil: marquee de apps con scroll real ──
   el track anima con transform bajo un contenedor con mask; en varios
   móviles esa combinación se congela, y como el contenedor tenía
   overflow:hidden el visitante se quedaba sin forma de ver el resto de
   apps (justo lo que reportó: se corta en Gmail/Calendar y ya no avanza).
   en táctil se cambia a scroll nativo -siempre deslizable- y el avance
   automático lo lleva el JS del componente (ver MarqueeSection). */
@media (hover:none) and (pointer:coarse){
  .mq-mask{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;-ms-overflow-style:none;}
  .mq-mask::-webkit-scrollbar{display:none;}
  .mq-track{animation:none;}
}

/* ── reduced-motion ── */
@media (prefers-reduced-motion:reduce){
  .hero-title .hw,.hero-sub,.hero-cta-row{animation:none!important;opacity:1!important;filter:none!important;transform:none!important;}
  .hero-marble{animation:none!important;opacity:1!important;transform:none!important;}
  .btn-glow{transition:none!important;}
  .btn-glow::before{animation:none;}
  .btn-glow-arrow{transition:none;}
  .mq-track{animation:none;}
  .lr-blob{animation:none;}
  .img-fade-in{animation:none;opacity:1!important;}
  html{scroll-behavior:auto;}
}
</style>
