<!-- ══════════════════════════════════════════════════════════════
     DESIGN SYSTEM · paleta "midnight violet" (web_06.jpg)
     base violeta-noche · acento azul luminoso del cubo-laberinto
     ══════════════════════════════════════════════════════════════ -->
<style>
:root{
  /* tokens de marca (web_06.jpg) */
  --vacio:#030306; --abismo:#12101A; --penumbra:#1E1D2C; --pizarra:#302E3C;
  --grafito:#403B47; --niebla:#706F7E; --ceniza:#858595; --luz:#EAE8F2;
  --pulso:#4B8CF7; --pulso-hondo:#1E4FAF;
  /* derivados semánticos */
  --bg:#0B0A12; --bg-deep:#08070C; --surface:#1E1D2C;
  --ink:#EAE8F2; --ink-mut:#9E9DB0;
  --accent:#4B8CF7; --accent-deep:#1E4FAF; --accent-soft:#8FB6FF;
  --accent-wash:rgba(75,140,247,.12);
  --line:rgba(234,232,242,.07); --line-2:rgba(234,232,242,.14);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:auto;} /* ScrollSmoother gestiona el suavizado */
body{background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:clip;}
a{text-decoration:none;color:inherit;}
::selection{background:rgba(75,140,247,.32);color:#fff;}

/* atmósfera violeta bajo las secciones de contenido */
body{
  background:
    radial-gradient(1100px 720px at 90% -2%,  rgba(75,140,247,.12), transparent 58%),
    radial-gradient(900px 680px at -6% 26%,    rgba(99,80,170,.10), transparent 55%),
    radial-gradient(1000px 760px at 106% 64%,  rgba(75,140,247,.09), transparent 58%),
    radial-gradient(900px 700px at 16% 96%,    rgba(99,80,170,.08), transparent 60%),
    linear-gradient(180deg,#0B0A12 0%,#0E0C18 26%,#0B0A12 54%,#0C0A14 78%,#050409 100%);
}
section[id]{scroll-margin-top:96px;}

/* ── liquid glass (hero) ── */
.lg{ background:rgba(255,255,255,.015);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.12);position:relative;overflow:hidden; }
.lg::before{ content:"";position:absolute;inset:0;border-radius:inherit;padding:1.4px;
  background:linear-gradient(180deg,rgba(255,255,255,.45) 0%,rgba(255,255,255,.15) 20%,
    rgba(255,255,255,0) 40%,rgba(255,255,255,0) 60%,rgba(255,255,255,.15) 80%,rgba(255,255,255,.45) 100%);
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none; }
.lg-s{ background:rgba(255,255,255,.015);backdrop-filter:blur(50px);-webkit-backdrop-filter:blur(50px);
  box-shadow:4px 4px 8px rgba(0,0,0,.1),inset 0 1px 1px rgba(255,255,255,.18);position:relative;overflow:hidden; }
.lg-s::before{ content:"";position:absolute;inset:0;border-radius:inherit;padding:1.4px;
  background:linear-gradient(180deg,rgba(255,255,255,.5) 0%,rgba(255,255,255,.2) 20%,
    rgba(255,255,255,0) 40%,rgba(255,255,255,0) 60%,rgba(255,255,255,.2) 80%,rgba(255,255,255,.5) 100%);
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none; }
.nav-link:hover{background:rgba(255,255,255,.08)!important;}
body.demo-open nav{opacity:0!important;pointer-events:none!important;transition:opacity .2s;}

/* fade-in del vídeo del hero */
@keyframes heroVideoIn{from{opacity:0;}to{opacity:1;}}
.hero-fade{animation:heroVideoIn 1100ms ease forwards;}

/* barra de progreso de scroll */
.scroll-progress{position:fixed;top:0;left:0;height:3px;width:0;z-index:120;
  background:linear-gradient(90deg,var(--pulso-hondo),var(--pulso) 55%,var(--accent-soft));
  box-shadow:0 0 14px rgba(75,140,247,.7);transition:width .08s linear;}

/* cursor de marca · halo + nodo que siguen al ratón (GSAP) */
.mz-cursor-ring,.mz-cursor-dot{position:fixed;top:0;left:0;z-index:9998;pointer-events:none;border-radius:50%;
  visibility:hidden;opacity:0;will-change:transform;}
.mz-cursor-ring{width:40px;height:40px;border:1.5px solid rgba(75,140,247,.55);
  background:rgba(75,140,247,0);box-shadow:0 0 22px rgba(75,140,247,.28);}
.mz-cursor-dot{width:6px;height:6px;background:#86E6FF;box-shadow:0 0 10px rgba(134,230,255,.95);}
@media(pointer:coarse){ .mz-cursor-ring,.mz-cursor-dot{display:none;} }

/* ── layout base de sección ── */
.v2-sec{position:relative;z-index:1;padding:clamp(81.9px,12vh,140.7px) clamp(21px,6vw,84px);}
.v2-inner{max-width:1200px;margin:0 auto;}
.v2-kicker{font-family:'JetBrains Mono',monospace;font-size:13.6px;letter-spacing:.04em;color:var(--ceniza);margin-bottom:18px;}
.v2-h2{font-family:'Bricolage Grotesque',sans-serif;color:#fff;font-size:clamp(35.7px,5.6vw,69.3px);line-height:.94;letter-spacing:-2px;}
.v2-h2 em,.v2-diag-result em{font-style:normal;color:var(--accent-soft);}
.v2-note{margin-top:18px;color:rgba(234,232,242,.66);max-width:54ch;font-family:'Inter';font-weight:300;font-size:clamp(15.7px,1.4vw,17.8px);line-height:1.55;}

/* glows parallax decorativos */
.fx-glow{position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none;z-index:0;opacity:.6;will-change:transform;}

/* ── botones ── */
.v2-btn{font-family:'Inter';font-size:15.3px;font-weight:500;display:inline-flex;align-items:center;gap:8px;
  padding:13px 22px;border-radius:9999px;cursor:pointer;min-height:46px;text-align:center;
  transition:transform .18s,background .18s,box-shadow .18s,border-color .18s;}
.v2-btn-accent{background:var(--accent);color:#fff;border:1px solid var(--accent);box-shadow:0 12px 30px -12px var(--accent);}
.v2-btn-accent:hover{background:var(--accent-deep);transform:translateY(-2px);box-shadow:0 18px 40px -14px var(--accent);}
.v2-btn-ghost{background:transparent;color:#fff;border:1px solid var(--line-2);}
.v2-btn-ghost:hover{background:rgba(255,255,255,.06);border-color:var(--accent-soft);}
.v2-btn-white{background:#fff;color:#0B0A12;border:1px solid #fff;}
.v2-btn-white:hover{transform:translateY(-2px);box-shadow:0 14px 32px -14px rgba(255,255,255,.4);}

/* grid de 3 */
.v2-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
@media(max-width:980px){.v2-grid-3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:600px){.v2-grid-3{grid-template-columns:1fr;}}

/* ═══ ANTES / DESPUÉS · Servicios ═══ */
.ba-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:20px;align-items:stretch;margin-top:56px;}
.ba-card{position:relative;border:1px solid var(--line-2);border-radius:20px;padding:28px 26px;height:100%;
  background:rgba(12,11,18,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);}
.ba-after{border-color:rgba(75,140,247,.5);box-shadow:0 0 50px -22px rgba(75,140,247,.7);
  background:linear-gradient(135deg,rgba(75,140,247,.18),rgba(12,11,18,.82));}
.ba-tag{font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;
  color:rgba(255,255,255,.45);display:block;margin-bottom:18px;}
.ba-tag-on{color:var(--accent-soft);}
.ba-card ul{list-style:none;display:flex;flex-direction:column;gap:14px;margin:0;padding:0;}
.ba-card li{display:flex;align-items:flex-start;gap:12px;font-family:'Inter';font-weight:300;font-size:15.7px;line-height:1.4;}
.ba-before li{color:rgba(255,255,255,.62);}
.ba-after li{color:rgba(255,255,255,.92);}
.ba-x{flex:0 0 auto;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:11.5px;color:var(--niebla);border:1px solid var(--line-2);background:rgba(255,255,255,.03);margin-top:1px;}
.ba-check{flex:0 0 auto;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--accent);box-shadow:0 0 10px -2px var(--accent);margin-top:1px;}
.ba-arrow{display:flex;align-items:center;justify-content:center;font-family:'Inter';font-size:35.7px;color:var(--accent-soft);opacity:.8;}
@media(max-width:860px){
  .ba-grid{grid-template-columns:1fr;}
  .ba-arrow{transform:rotate(90deg);margin:2px 0;}
}

/* ═══ LÍNEA RECTA · momento de marca (scroll-draw) ═══ */
.lr-sec{position:relative;z-index:1;padding:clamp(73.5px,12vh,126px) clamp(21px,6vw,84px);overflow:hidden;}
.lr-inner{max-width:1200px;margin:0 auto;text-align:center;position:relative;z-index:1;}
.lr-kicker{font-family:'JetBrains Mono',monospace;font-size:12.6px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent-soft);}
.lr-title{font-family:'Bricolage Grotesque',sans-serif;font-weight:400;color:#fff;letter-spacing:-2px;line-height:1.02;
  font-size:clamp(31.5px,5vw,60.9px);margin:18px auto 4px;max-width:18ch;}
.lr-title em{font-style:italic;background:linear-gradient(90deg,#8FB6FF,#4B8CF7 45%,#86E6FF);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;}
/* escenario en cristal · laberinto → línea recta (VERTICAL · caos arriba → orden abajo) */
.lr-stage{position:relative;width:min(100%,480px);margin:60px auto 0;border:1px solid var(--line-2);border-radius:32px;overflow:hidden;
  background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.012));
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:0 60px 130px -55px rgba(0,0,0,.88),inset 0 1px 1px rgba(255,255,255,.09);
  padding:clamp(30px,4.5vw,52px) clamp(22px,4vw,44px);min-height:clamp(640px,90vh,840px);
  display:flex;align-items:center;justify-content:center;}
.lr-stage::after{content:"";position:absolute;left:50%;top:6%;width:300px;height:250px;transform:translateX(-50%);
  background:radial-gradient(circle,rgba(120,95,180,.28),transparent 68%);filter:blur(26px);pointer-events:none;z-index:0;}
.lr-stage::before{content:"";position:absolute;left:50%;bottom:4%;width:380px;height:380px;transform:translateX(-50%);
  background:radial-gradient(circle,rgba(75,140,247,.46),rgba(134,230,255,.14) 44%,transparent 70%);filter:blur(18px);pointer-events:none;z-index:0;}
.lr-svg{position:relative;z-index:1;display:block;height:clamp(540px,82vh,760px);width:auto;max-width:100%;margin:0 auto;overflow:visible;}
.maze-ghost{fill:none;stroke:rgba(180,178,196,.15);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.maze-path{fill:none;stroke:url(#lr-grad-v);stroke-width:4.6;stroke-linecap:round;stroke-linejoin:round;
  filter:drop-shadow(0 0 9px rgba(95,170,255,.6));}
.lr-wp{fill:#86E6FF;opacity:0;filter:drop-shadow(0 0 7px rgba(134,230,255,.95));}
.lr-traveldot{fill:#e2f5ff;filter:drop-shadow(0 0 14px rgba(134,230,255,1));}
.lr-axis-top{fill:rgba(192,190,212,.76);font-family:'JetBrains Mono',monospace;font-size:21px;letter-spacing:4px;}
.lr-axis-bot{fill:#9fd8ff;font-family:'JetBrains Mono',monospace;font-size:21px;letter-spacing:4px;}
@keyframes nodePulse{0%,100%{filter:drop-shadow(0 0 8px rgba(134,230,255,.8));}50%{filter:drop-shadow(0 0 26px rgba(134,230,255,1));}}
.maze-node{animation:nodePulse 2.4s ease-in-out infinite;}
/* frases grandes a los lados de la columna · revelado palabra a palabra */
.lr-flank{display:grid;grid-template-columns:1fr minmax(300px,440px) 1fr;align-items:center;
  gap:clamp(20px,3.2vw,72px);width:min(1380px,94vw);margin-left:50%;transform:translateX(-50%);margin-top:52px;}
.lr-flank .lr-stage{width:100%;max-width:460px;margin:0 auto;}
.lr-side{font-family:'Bricolage Grotesque',sans-serif;font-weight:300;line-height:1.12;
  letter-spacing:-1.2px;font-size:clamp(21px,2.7vw,42px);text-wrap:balance;}
.lr-side-l{text-align:right;color:var(--ceniza);}      /* el problema · apagado */
.lr-side-r{text-align:left;color:#EAE8F2;}              /* la solución · claro */
.lr-side-r .w{color:#EAE8F2;}
.lr-side .w{opacity:.06;filter:blur(8px);will-change:opacity,filter;}
@media(max-width:980px){
  .lr-flank{grid-template-columns:1fr;gap:22px;}
  .lr-side{text-align:center!important;font-size:clamp(19px,5.2vw,28px);max-width:22ch;margin:0 auto;line-height:1.2;letter-spacing:-.6px;}
  .lr-side-l{order:-1;}
  .lr-side-r{order:1;}
}
/* blobs de luz ambiental · oscilación lenta */
.lr-blob{position:absolute;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0;opacity:.55;will-change:transform;}
@keyframes lrFloat1{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(40px,-30px) scale(1.1);}}
@keyframes lrFloat2{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-46px,28px) scale(1.08);}}

/* ═══ MARQUEE · tus herramientas ═══ */
.mq-sec{position:relative;z-index:1;padding:8px 0 clamp(35.7px,6vh,58.8px);}
.mq-head{text-align:center;font-family:'JetBrains Mono',monospace;font-size:clamp(13px,1.5vw,15.5px);font-weight:500;
  letter-spacing:.12em;text-transform:uppercase;color:var(--luz);margin-bottom:26px;line-height:1.5;}
.mq-head .mk{color:var(--accent);opacity:.6;}
.mq-head em{font-style:normal;color:var(--accent-soft);}
.mq-mask{position:relative;overflow:hidden;
  -webkit-mask:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent);
  mask:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent);}
.mq-track{display:flex;width:max-content;gap:14px;animation:mqScroll 38s linear infinite;}
.mq-track:hover{animation-play-state:paused;}
@keyframes mqScroll{to{transform:translateX(-50%);}}
.mq-chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:9px;white-space:nowrap;
  font-family:'Bricolage Grotesque',sans-serif;font-weight:500;font-size:15.7px;color:rgba(234,232,242,.82);
  background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:9999px;padding:10px 18px;backdrop-filter:blur(6px);}
.mq-chip .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);}

/* ═══ SOLUCIONES · tarjetas con spotlight ═══ */
.v2-sol{position:relative;overflow:hidden;display:flex;flex-direction:column;height:100%;
  background:rgba(255,255,255,.022);border:1px solid var(--line);border-radius:20px;padding:26px 24px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:transform .26s ease,box-shadow .26s ease,border-color .26s ease;}
.v2-sol::before{content:"";position:absolute;inset:0;z-index:0;opacity:0;pointer-events:none;transition:opacity .35s ease;
  background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),rgba(75,140,247,.22),transparent 62%);}
.v2-sol:hover{transform:translateY(-4px);border-color:rgba(75,140,247,.4);
  box-shadow:0 30px 60px -34px rgba(75,140,247,.6),0 4px 20px -10px rgba(0,0,0,.7);}
.v2-sol:hover::before{opacity:1;}
.v2-sol>*{position:relative;z-index:1;}
.v2-sol-fn{font-family:'JetBrains Mono',monospace;font-size:12.6px;color:var(--accent-soft);}
.v2-sol h3{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:20px;letter-spacing:-.01em;margin:11px 0 9px;color:#fff;}
.v2-sol p{font-family:'Inter';font-weight:300;font-size:15.3px;color:rgba(234,232,242,.68);line-height:1.55;margin-bottom:16px;}
.v2-sol-foot{margin-top:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.v2-metric{font-family:'JetBrains Mono',monospace;font-size:11.1px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--accent-soft);background:var(--accent-wash);border-radius:8px;padding:6px 11px;}
.v2-demolink{font-family:'JetBrains Mono',monospace;font-size:11.1px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--accent-soft);display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:8px;
  padding:6px 11px;white-space:nowrap;transition:background .18s,border-color .18s,transform .18s;}
.v2-demolink:hover{background:var(--accent-wash);border-color:var(--accent-soft);transform:translateY(-1px);}

/* ═══ POR QUÉ MAZESTUDIO ═══ */
.pq-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:48px;}
@media(max-width:900px){.pq-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:520px){.pq-grid{grid-template-columns:1fr;}}
.pq-card{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:18px;padding:24px 22px;height:100%;
  background:rgba(255,255,255,.02);backdrop-filter:blur(8px);transition:transform .26s ease,box-shadow .26s ease,border-color .26s ease;}
.pq-card::before{content:"";position:absolute;inset:0;z-index:0;opacity:0;pointer-events:none;transition:opacity .35s ease;
  background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),rgba(75,140,247,.22),transparent 62%);}
.pq-card:hover{transform:translateY(-4px);border-color:rgba(75,140,247,.4);
  box-shadow:0 30px 60px -34px rgba(75,140,247,.6),0 4px 20px -10px rgba(0,0,0,.7);}
.pq-card:hover::before{opacity:1;}
.pq-card>*{position:relative;z-index:1;}
.pq-ic{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;
  background:var(--accent-wash);border:1px solid rgba(75,140,247,.3);color:var(--accent-soft);margin-bottom:16px;}
.pq-card h4{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:17.8px;color:#fff;letter-spacing:-.01em;margin-bottom:8px;}
.pq-card p{font-family:'Inter';font-weight:300;font-size:14.7px;color:rgba(234,232,242,.64);line-height:1.55;}

/* ═══ PIPELINE ═══ */
.v2-pipe{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;}
.v2-pstep{position:relative;border:1px solid var(--line);border-radius:16px;padding:22px 20px;
  background:rgba(255,255,255,.018);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:transform .26s,border-color .26s;}
.v2-pstep:hover{transform:translateY(-3px);border-color:rgba(75,140,247,.35);}
.v2-pstep .ix{font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-soft);}
.v2-pstep h4{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:18.9px;margin:12px 0 8px;color:#fff;}
.v2-pstep p{font-family:'Inter';font-weight:300;font-size:14.1px;color:rgba(234,232,242,.64);line-height:1.5;}
.v2-pstep .tools{margin-top:14px;display:flex;flex-wrap:wrap;gap:6px;}
.v2-pstep .tools span{font-family:'JetBrains Mono',monospace;font-size:11.1px;color:#fff;
  background:rgba(255,255,255,.05);border:1px solid var(--line-2);border-radius:6px;padding:3px 8px;}
@media(min-width:861px){
  .v2-pipe{gap:34px;}
  .v2-pstep:not(:last-child)::after{content:"";position:absolute;top:50%;right:-34px;width:34px;height:2px;
    background:repeating-linear-gradient(90deg,var(--accent-soft),var(--accent-soft) 5px,transparent 5px,transparent 10px);opacity:.6;}
}
@media(max-width:860px){.v2-pipe{grid-template-columns:1fr;}}

/* ═══ DEMO PLAYER ═══ */
.dp-stage{display:grid;grid-template-columns:1fr minmax(260px,300px);gap:16px;align-items:stretch;}
.dp{border:1px solid var(--line-2);border-radius:20px;overflow:hidden;background:var(--surface);position:relative;
  box-shadow:0 0 0 1px rgba(255,255,255,.04) inset,0 60px 120px -60px rgba(0,0,0,.9),0 0 80px -30px rgba(75,140,247,.14);}
.dp::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--accent-soft),transparent);}
.dp-body{padding:42px 44px;display:flex;flex-direction:column;gap:34px;min-height:300px;
  opacity:0;transform:translateY(8px);transition:opacity .35s,transform .35s;}
.dp-body.vis{opacity:1;transform:none;}
.dp-head{display:flex;justify-content:space-between;align-items:flex-end;gap:28px;flex-wrap:wrap;}
.dp-head-txt{flex:1 1 280px;min-width:240px;}
.dp-head-cta{display:flex;flex-direction:column;align-items:flex-end;gap:9px;flex-shrink:0;}
.dp-badge-live{display:inline-flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:9.4px;letter-spacing:.15em;text-transform:uppercase;
  padding:4px 10px;border-radius:100px;background:rgba(52,211,153,.1);color:#34D399;border:1px solid rgba(52,211,153,.2);margin-bottom:18px;width:fit-content;}
.dp-badge-live .bdot{width:5px;height:5px;border-radius:50%;background:#34D399;animation:dpblink 2s ease-in-out infinite;}
.dp-badge-soon{display:inline-flex;align-items:center;font-family:'JetBrains Mono',monospace;font-size:9.4px;letter-spacing:.15em;text-transform:uppercase;
  padding:4px 10px;border-radius:100px;background:rgba(255,255,255,.05);color:var(--ink-mut);border:1px solid var(--line-2);margin-bottom:18px;width:fit-content;}
@keyframes dpblink{0%,100%{opacity:1}50%{opacity:.2}}
.dp-name{font-family:'Bricolage Grotesque',sans-serif;font-size:27.3px;font-weight:700;letter-spacing:-.025em;line-height:1.1;margin-bottom:12px;}
.dp-desc{font-size:15.7px;color:var(--ink-mut);line-height:1.65;margin-bottom:10px;max-width:32ch;}
.dp-time{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:rgba(234,232,242,.45);letter-spacing:.06em;margin:0;white-space:nowrap;}
.dp-time span{color:var(--accent-soft);}
.dp-btn{display:inline-flex;align-items:center;gap:13px;font-family:'Bricolage Grotesque',sans-serif;font-size:18px;font-weight:600;
  padding:17px 34px;border-radius:14px;background:var(--accent);color:#fff;border:none;cursor:pointer;
  transition:transform .2s,box-shadow .2s,background .2s;box-shadow:0 10px 38px -8px rgba(75,140,247,.65);
  width:fit-content;text-decoration:none;position:relative;overflow:hidden;}
.dp-btn span{font-size:1.15em;}
.dp-btn::before{content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent);animation:dpshimmer 5s ease-in-out 1.5s infinite;}
@keyframes dpshimmer{0%{left:-100%}18%,100%{left:150%}}
.dp-btn:hover{transform:translateY(-2px);box-shadow:0 14px 40px -8px rgba(75,140,247,.8);background:var(--accent-deep);}
.dp-btn-dis{display:inline-flex;align-items:center;gap:10px;font-family:'Bricolage Grotesque',sans-serif;font-size:14.7px;font-weight:600;
  padding:13px 24px;border-radius:12px;background:rgba(255,255,255,.04);color:var(--ink-mut);border:1px solid var(--line);width:fit-content;cursor:not-allowed;}
/* 3 pasos humanos */
.dp-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;position:relative;margin-top:auto;}
.dp-steps::before{content:'';position:absolute;top:33px;left:16.6%;right:16.6%;height:2px;z-index:0;
  background:linear-gradient(90deg,rgba(75,140,247,.12),rgba(75,140,247,.5),rgba(75,140,247,.12));}
.dp-step{display:flex;flex-direction:column;align-items:center;text-align:center;gap:15px;position:relative;z-index:1;}
.dp-step-ic{width:66px;height:66px;border-radius:18px;display:grid;place-items:center;position:relative;flex-shrink:0;
  background:linear-gradient(180deg,rgba(75,140,247,.16),rgba(75,140,247,.06));border:1px solid rgba(75,140,247,.3);
  box-shadow:0 10px 26px -12px rgba(75,140,247,.6);}
.dp-step-svg{display:flex;}
.dp-step-svg svg{width:30px;height:30px;display:block;}
.dp-step-n{position:absolute;top:-8px;right:-8px;width:21px;height:21px;border-radius:50%;background:var(--accent);color:#fff;
  font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.45);}
.dp-step-t{font-size:15.5px;color:var(--ink);line-height:1.45;font-weight:500;max-width:21ch;}
.dp-footer{padding:13px 24px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:flex-end;background:rgba(0,0,0,.18);}
.dp-url{font-family:'JetBrains Mono',monospace;font-size:11.1px;color:rgba(234,232,242,.45);letter-spacing:.04em;display:flex;align-items:center;gap:6px;}
.dp-hint{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:rgba(234,232,242,.3);letter-spacing:.08em;}
/* picker cards */
.dp-picker{display:flex;flex-direction:column;gap:10px;}
.dp-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;cursor:pointer;
  display:flex;flex-direction:column;justify-content:center;gap:5px;flex:1 1 0;min-height:84px;transition:border-color .2s,background .2s,transform .2s;
  position:relative;overflow:hidden;text-align:left;color:var(--ink);}
.dp-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .25s;}
.dp-card:hover:not(.dp-dis){border-color:rgba(75,140,247,.4);background:rgba(30,29,44,.7);transform:translateY(-2px);}
.dp-card:hover:not(.dp-dis)::before{transform:scaleX(.35);}
.dp-card.dp-act{border-color:rgba(75,140,247,.55);background:rgba(75,140,247,.09);}
.dp-card.dp-act::before{transform:scaleX(1);}
.dp-card.dp-dis{opacity:.38;cursor:not-allowed;}
.dp-cn{font-family:'JetBrains Mono',monospace;font-size:9.4px;letter-spacing:.16em;color:rgba(234,232,242,.35);}
.dp-act .dp-cn{color:var(--accent-soft);}
.dp-ci{display:none;}
.dp-cname{font-family:'Bricolage Grotesque',sans-serif;font-size:18.9px;font-weight:700;letter-spacing:-.025em;color:var(--ink);line-height:1.2;}
.dp-cst{display:flex;align-items:center;gap:5px;font-family:'JetBrains Mono',monospace;font-size:8.4px;letter-spacing:.1em;text-transform:uppercase;margin-top:1px;}
.dp-cst .sdot{width:5px;height:5px;border-radius:50%;background:#34D399;animation:dpblink 2s ease-in-out infinite;flex-shrink:0;}
.dp-cst.soon{color:rgba(234,232,242,.3);}
.dp-livedot{position:absolute;top:15px;right:15px;width:8px;height:8px;border-radius:50%;background:#34D399;
  box-shadow:0 0 0 4px rgba(52,211,153,.14);animation:dpblink 2s ease-in-out infinite;}
/* modal */
.dp-modal{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;padding:30px;
  background:rgba(4,4,7,.88);backdrop-filter:blur(8px);}
.dp-modal .dp-shell{position:relative;width:100%;max-width:920px;transition:max-width .25s ease;}
.dp-modal .dp-frame{position:relative;width:100%;height:92vh;max-height:92vh;border-radius:16px;overflow:hidden;
  transition:height .3s ease;
  box-shadow:0 40px 110px -30px rgba(0,0,0,.8),0 0 0 1px var(--line-2);}
.dp-modal iframe{width:100%;height:100%;border:0;display:block;}
.dp-modal .dp-close{position:absolute;top:-15px;right:-15px;z-index:5;width:44px;height:44px;border-radius:50%;
  background:rgba(11,12,16,.82);color:#fff;border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(6px);
  font-size:18.9px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .18s,background .18s;}
.dp-modal .dp-close:hover{transform:scale(1.08);background:#000;}
@media(max-width:860px){.dp-modal{padding:0;}.dp-modal .dp-shell{max-width:none;}.dp-modal .dp-frame{height:100dvh;border-radius:0;}.dp-modal .dp-close{top:10px;right:10px;}}
@media(max-width:1040px){
  .dp-stage{grid-template-columns:1fr;}
  .dp-picker{display:grid;grid-template-columns:repeat(4,1fr);margin-top:12px;}
  .dp-card{justify-content:flex-start;min-height:0;}
}
@media(max-width:860px){
  .dp-body{padding:30px 24px;gap:26px;}
  .dp-head{align-items:flex-start;}
  .dp-head-cta{align-items:flex-start;}
  .dp-steps{grid-template-columns:1fr;gap:14px;}
  .dp-steps::before{display:none;}
  .dp-step{flex-direction:row;text-align:left;gap:14px;}
  .dp-step-t{max-width:none;}
  .dp-picker{grid-template-columns:1fr 1fr;}
}

/* ═══ ROI ═══ */
/* ═══ ROI · calculadora destacada ═══ */
.roi2-sec{position:relative;z-index:1;overflow:hidden;padding:clamp(88px,13vh,150px) clamp(21px,6vw,84px);}
.roi2-atmos{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.roi2-blob{position:absolute;border-radius:50%;filter:blur(90px);will-change:transform;}
@keyframes roi2Float{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(34px,-26px) scale(1.08);}}
.roi2-inner{position:relative;z-index:1;max-width:1180px;margin:0 auto;}
.roi2-head{text-align:center;max-width:none;margin:0 auto 50px;}
.roi2-card{display:grid;grid-template-columns:1fr 1.08fr;border-radius:26px;overflow:hidden;
  border:1px solid var(--line-2);background:rgba(20,19,30,.5);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:0 50px 120px -50px rgba(0,0,0,.85),inset 0 1px 1px rgba(255,255,255,.06);}
.roi2-controls{padding:clamp(26px,3.2vw,42px);border-right:1px solid var(--line-2);}
.roi2-result{position:relative;overflow:hidden;padding:clamp(26px,3.2vw,42px);display:flex;flex-direction:column;
  background:linear-gradient(155deg,rgba(75,140,247,.18),rgba(30,79,175,.04) 58%,transparent);}
.roi2-glow{position:absolute;width:360px;height:360px;border-radius:50%;top:-100px;right:-100px;pointer-events:none;z-index:0;
  background:radial-gradient(circle,rgba(75,140,247,.45),transparent 64%);filter:blur(30px);
  animation:roi2pulse 5.5s ease-in-out infinite;}
@keyframes roi2pulse{0%,100%{opacity:.45;transform:scale(1);}50%{opacity:.85;transform:scale(1.12);}}

/* controles */
.roi2-field{margin-bottom:28px;}
.roi2-field:last-child{margin-bottom:0;}
.roi2-flbl{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px;}
.roi2-flbl>span:first-child{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ceniza);line-height:1.4;}
.roi2-fval{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:25px;color:#fff;letter-spacing:-.02em;white-space:nowrap;}
.roi2-fval small{font-size:14px;color:var(--accent-soft);font-weight:500;margin-left:1px;}
.roi2-range{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:6px;outline:none;cursor:pointer;
  background:linear-gradient(90deg,var(--accent) 0,var(--accent) var(--p,50%),rgba(255,255,255,.1) var(--p,50%),rgba(255,255,255,.1) 100%);}
.roi2-range::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--accent);
  box-shadow:0 0 0 5px rgba(75,140,247,.16),0 4px 12px rgba(0,0,0,.45);transition:transform .15s,box-shadow .2s;cursor:grab;}
.roi2-range::-webkit-slider-thumb:hover{transform:scale(1.14);box-shadow:0 0 0 8px rgba(75,140,247,.24),0 5px 16px rgba(0,0,0,.5);}
.roi2-range::-webkit-slider-thumb:active{cursor:grabbing;}
.roi2-range::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--accent);box-shadow:0 0 0 5px rgba(75,140,247,.16);}
.roi2-levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.roi2-lvl{font-family:'Inter';font-size:14px;color:rgba(234,232,242,.66);cursor:pointer;background:rgba(255,255,255,.04);
  border:1px solid var(--line-2);border-radius:11px;padding:12px 8px;min-height:46px;transition:all .18s;}
.roi2-lvl:hover{border-color:var(--accent-soft);color:#fff;}
.roi2-lvl.active{border-color:var(--accent);background:var(--accent-wash);color:#fff;box-shadow:0 0 24px -10px var(--accent);}

/* resultado */
.roi2-rlabel{position:relative;z-index:1;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-soft);}
.roi2-big{position:relative;z-index:1;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;
  font-size:clamp(50px,7vw,86px);line-height:.9;letter-spacing:-3px;color:#fff;margin:12px 0 6px;
  text-shadow:0 0 70px rgba(75,140,247,.55);font-variant-numeric:tabular-nums;}
.roi2-big-cur{font-size:.5em;color:var(--accent-soft);letter-spacing:-1px;}
.roi2-sub{position:relative;z-index:1;font-family:'Inter';font-weight:300;font-size:15px;color:rgba(234,232,242,.64);}
.roi2-split{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:26px 0 22px;}
.roi2-stat{border:1px solid var(--line-2);border-radius:14px;padding:15px 16px;background:rgba(255,255,255,.03);}
.roi2-stat .n{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:30px;color:#fff;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums;}
.roi2-stat .n small{font-size:16px;color:var(--accent-soft);font-weight:500;margin-left:2px;}
.roi2-stat .l{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:rgba(234,232,242,.45);margin-top:8px;line-height:1.4;}
.roi2-barwrap{position:relative;z-index:1;margin-bottom:24px;}
.roi2-barlbl{display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:rgba(234,232,242,.5);margin-bottom:9px;}
.roi2-bar{height:10px;border-radius:6px;background:rgba(255,255,255,.06);overflow:hidden;}
.roi2-bar-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent-deep),var(--accent),var(--accent-soft));
  box-shadow:0 0 18px -2px var(--accent);transition:width 1s cubic-bezier(.16,1,.3,1);}
.roi2-barnote{font-family:'Inter';font-size:12.5px;color:rgba(234,232,242,.5);margin-top:9px;}
.roi2-cta{position:relative;z-index:1;display:flex;gap:12px;flex-wrap:wrap;margin-top:auto;}
.roi2-note{position:relative;z-index:1;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.03em;color:rgba(234,232,242,.4);margin-top:16px;}

@media(max-width:860px){
  .roi2-card{grid-template-columns:1fr;}
  .roi2-controls{border-right:none;border-bottom:1px solid var(--line-2);}
}
@media(max-width:430px){
  .roi2-cta .v2-btn{flex:1 1 auto;justify-content:center;}
  .roi2-split{grid-template-columns:1fr;}
}

/* ═══ DIAGNÓSTICO ═══ */
.v2-diag-tag{display:inline-flex;align-items:center;gap:10px;margin-bottom:20px;
  font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:rgba(234,232,242,.5);}
.v2-diag-tag .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-wash);}
.v2-progress{height:2px;background:var(--line-2);border-radius:2px;overflow:hidden;}
.v2-progress-fill{height:100%;background:var(--accent);transition:width .4s ease;}
.v2-diag-q{border:1px solid var(--line-2);border-radius:14px;overflow:hidden;
  background:rgba(255,255,255,.02);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:border-color .2s ease;}
.v2-diag-q.open{border-color:var(--accent);}
.v2-diag-head{display:flex;align-items:center;gap:16px;padding:20px 22px;cursor:pointer;min-height:64px;}
.v2-diag-num{font-family:'JetBrains Mono',monospace;font-size:12.6px;color:rgba(234,232,242,.45);}
.v2-diag-qtext{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:17.8px;letter-spacing:-.01em;flex:1;color:#fff;}
.v2-diag-icon{flex:0 0 auto;width:28px;height:28px;border-radius:50%;border:1px solid var(--line-2);
  display:flex;align-items:center;justify-content:center;color:rgba(234,232,242,.6);font-size:18.9px;line-height:1;
  transition:transform .3s ease,background .3s ease,border-color .3s ease,color .3s ease;}
.v2-diag-q.open .v2-diag-icon{transform:rotate(45deg);background:var(--accent);border-color:var(--accent);color:#fff;}
.v2-diag-opts{display:flex;flex-direction:column;gap:10px;padding:0 22px 20px 58px;}
.v2-diag-opt{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:10px;min-height:44px;cursor:pointer;
  border:1px solid var(--line-2);background:rgba(255,255,255,.025);font-family:'Inter';font-size:14.7px;color:rgba(234,232,242,.7);
  transition:border-color .2s,background .2s,color .2s;}
.v2-diag-opt:hover{border-color:var(--accent-soft);background:var(--accent-wash);}
.v2-diag-opt.sel{border-color:var(--accent);background:var(--accent-wash);color:#fff;}
.v2-diag-check{flex:0 0 auto;width:18px;height:18px;border-radius:50%;border:1px solid var(--line-2);
  display:flex;align-items:center;justify-content:center;transition:background .2s,border-color .2s;}
.v2-diag-opt.sel .v2-diag-check{background:var(--accent);border-color:var(--accent);}
.v2-diag-result{margin-top:28px;border:1px solid var(--accent);border-radius:14px;background:var(--accent-wash);padding:28px;}
.v2-diag-result .rtag{display:block;font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-soft);margin-bottom:12px;}
.v2-diag-result h3{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:23.1px;letter-spacing:-.015em;color:#fff;}
.v2-diag-result p{font-family:'Inter';font-weight:300;font-size:15.7px;color:rgba(234,232,242,.7);margin:12px 0 24px;line-height:1.55;}
.v2-diag-result .acts{display:flex;gap:12px;flex-wrap:wrap;}
@media(max-width:560px){.v2-diag-opts{padding:0 18px 18px 18px;}.v2-diag-qtext{font-size:16.2px;}}

/* ═══ FOOTER ═══ */
.v2-footer{position:relative;z-index:1;background:#06060A;border-top:1px solid var(--line);padding:54px clamp(21px,6vw,84px) 38px;}
.v2-footer .inner{max-width:1200px;margin:0 auto;}
.v2-footer .top{display:flex;justify-content:space-between;align-items:flex-start;gap:32px;flex-wrap:wrap;padding-bottom:32px;border-bottom:1px solid var(--line);}
.v2-footer nav{display:flex;gap:28px;flex-wrap:wrap;}

<script type="text/babel">
(function(){
  const { useRef, useEffect } = React;
  function FadingVideo({ src, poster, preload = 'auto', style }) {
    const ref = useRef(null);
    useEffect(() => {
      const v = ref.current; if (!v) return;
      v.play().catch(() => {});
    }, [src]);
    return (
      <div style={{position:'absolute',inset:0,overflow:'hidden',...style}}>
        <video ref={ref} src={src} poster={poster} muted playsInline preload={preload} loop autoPlay className="hero-fade"
          style={{position:'absolute',inset:0,width:'100%',height:'100%',objectFit:'cover',opacity:0}} />
      </div>
    );
  }
  window.FadingVideo = FadingVideo;
})();

<script type="text/babel">
(function(){
  const { useEffect, useRef, useState } = React;
  const motion = window.Motion.motion;
  function BlurText({ text, style }) {
    const [inView, setInView] = useState(false);
    const ref = useRef(null);
    useEffect(() => {
      const io = new IntersectionObserver(([e])=>{ if(e.isIntersecting) setInView(true); },{threshold:0.1});
      if (ref.current) io.observe(ref.current);
      return () => io.disconnect();
    }, []);
    return (
      <p ref={ref} style={{display:'flex',flexWrap:'wrap',justifyContent:'flex-start',rowGap:'0.1em',...style}}>
        {text.split(' ').map((w,i) => (
          <motion.span key={i}
            initial={{filter:'blur(10px)',opacity:0,y:50}}
            animate={inView?{filter:'blur(0px)',opacity:1,y:0}:{}}
            transition={{duration:0.7,delay:(i*100)/1000,ease:'easeOut'}}
            style={{display:'inline-block',marginRight:'0.28em'}}>
            {w}
          </motion.span>
        ))}
      </p>
    );
  }
  window.BlurText = BlurText;
})();
</script>

<script type="text/babel">
(function(){
  const { useEffect, useRef, useState } = React;
  const motion = window.Motion.motion;
  window.Reveal = function Reveal({ children, delay = 0, y = 26, style, className }) {
    const [inView, setInView] = useState(false);
    const ref = useRef(null);
    useEffect(() => {
      const io = new IntersectionObserver(([e]) => {
        if (e.isIntersecting) { setInView(true); io.disconnect(); }
      }, { threshold: 0.12, rootMargin: '0px 0px -8% 0px' });
      if (ref.current) io.observe(ref.current);
      return () => io.disconnect();
    }, []);
    return (
      <motion.div ref={ref} className={className}
        initial={{ opacity: 0, y, filter: 'blur(8px)' }}
        animate={inView ? { opacity: 1, y: 0, filter: 'blur(0px)' } : {}}
        transition={{ duration: 0.7, delay, ease: [0.16, 1, 0.3, 1] }}
        style={style}>
        {children}
      </motion.div>
    );
  };

  // ── Encabezados de sección: revelado GSAP (ScrollTrigger) en cascada al scrollear ──
  // Drop-in con la misma API que <Reveal>, pero movido por GSAP en vez de framer-motion.
  // useLayoutEffect fija el estado oculto antes del primer paint (sin parpadeo);
  // gsap.context scoped al ref + ctx.revert() limpia tween y ScrollTrigger al desmontar.
  window.HeadReveal = function HeadReveal({ children, delay = 0, y = 28, style, className }) {
    const ref = useRef(null);
    React.useLayoutEffect(() => {
      const el = ref.current;
      if (!el || !window.gsap || !window.ScrollTrigger) return;
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return; // visible por defecto
      // hijos directos -> cascada (kicker, h2, nota...); si no hay, el propio wrapper
      const items = el.children.length ? Array.from(el.children) : [el];
      const ctx = window.gsap.context(() => {
        window.gsap.set(items, { opacity: 0, y, filter: 'blur(10px)' });
        window.gsap.to(items, {
          opacity: 1, y: 0, filter: 'blur(0px)',
          duration: 1.0, ease: 'expo.out',
          stagger: 0.085, delay,
          clearProps: 'filter',
          scrollTrigger: { trigger: el, start: 'top 84%', once: true }
        });
      }, ref);
      return () => ctx.revert();
    }, []);
    return (<div ref={ref} className={className} style={style}>{children}</div>);
  };

  window.IconExternal = function IconExternal() {
    return (<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>);
  };
  window.IconCheck = function IconCheck() {
    return (<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><path d="M5 13l4 4L19 7"/></svg>);
  };
})();
</script>

<!-- ══════════════════════════════════════════
     3.5 · SCROLL FX (progress · parallax · magnetic)
════════════════════════════════════════════ -->
<script type="text/babel">
(function(){
  const { useEffect } = React;
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const coarse  = window.matchMedia('(pointer: coarse)').matches;

  window.ScrollFX = function ScrollFX() {
    useEffect(() => {
      // ── barra de progreso ──
      const bar = document.getElementById('scrollProgress');
      let raf = null;
      const onScroll = () => {
        if (raf) return;
        raf = requestAnimationFrame(() => {
          const h = document.documentElement;
          const max = h.scrollHeight - h.clientHeight;
          const p = max > 0 ? (h.scrollTop || window.scrollY) / max : 0;
          if (bar) bar.style.width = (p * 100).toFixed(2) + '%';
          raf = null;
        });
      };
      window.addEventListener('scroll', onScroll, { passive: true });
      onScroll();

      // ── GSAP: parallax al scrollear ──
      const ctx = (window.gsap && window.ScrollTrigger && !reduced)
        ? window.gsap.context(() => {
            // glows decorativos de fondo (capa lenta)
            document.querySelectorAll('.fx-glow').forEach(el => {
              const depth = parseFloat(el.dataset.depth || '0.18');
              window.gsap.to(el, {
                yPercent: depth * 100,
                ease: 'none',
                scrollTrigger: { trigger: el.closest('section') || el, start: 'top bottom', end: 'bottom top', scrub: true }
              });
            });

            // parallax sutil de titulares de sección (capa de contenido)
            document.querySelectorAll('.v2-h2').forEach(el => {
              window.gsap.fromTo(el, { yPercent: 0 }, {
                yPercent: -18,
                ease: 'none',
                scrollTrigger: { trigger: el.closest('section') || el, start: 'top bottom', end: 'bottom top', scrub: true }
              });
            });

            // parallax genérico por atributo: data-parallax="<-1..1>"
            // (opcional data-parallax-start / data-parallax-end para sobrescribir el rango)
            document.querySelectorAll('[data-parallax]').forEach(el => {
              const depth = parseFloat(el.dataset.parallax || '0');
              if (!depth) return;
              window.gsap.fromTo(el, { yPercent: 0 }, {
                yPercent: depth * 100,
                ease: 'none',
                scrollTrigger: {
                  trigger: el.closest('section') || el,
                  start: el.dataset.parallaxStart || 'top bottom',
                  end:   el.dataset.parallaxEnd   || 'bottom top',
                  scrub: true
                }
              });
            });
          })
        : null;

      // ── botones magnéticos ──
      const cleanups = [];
      if (!reduced && !coarse) {
        document.querySelectorAll('.magnetic').forEach(el => {
          const move = e => {
            const r = el.getBoundingClientRect();
            const mx = e.clientX - (r.left + r.width / 2);
            const my = e.clientY - (r.top + r.height / 2);
            el.style.transform = `translate(${mx * 0.22}px, ${my * 0.3}px)`;
          };
          const leave = () => { el.style.transform = 'translate(0,0)'; };
          el.addEventListener('pointermove', move);
          el.addEventListener('pointerleave', leave);
          cleanups.push(() => { el.removeEventListener('pointermove', move); el.removeEventListener('pointerleave', leave); });
        });
      }

      // refresca ScrollTrigger cuando todo asienta (fuentes/vídeo)
      const refresh = () => window.ScrollTrigger && window.ScrollTrigger.refresh();
      const t = setTimeout(refresh, 900);
      window.addEventListener('load', refresh);

      return () => {
        window.removeEventListener('scroll', onScroll);
        window.removeEventListener('load', refresh);
        clearTimeout(t);
        cleanups.forEach(fn => fn());
        if (ctx) ctx.revert();
      };
    }, []);
    return null;
  };
})();
</script>

<!-- ══════════════════════════════════════════
     CINEMATIC TRANSITIONS · momentos 2 y 3 (C)
════════════════════════════════════════════ -->
<script type="text/babel">
(function(){
  const { useEffect } = React;
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  window.CinematicTransitions = function CinematicTransitions(){
    useEffect(()=>{
      const desktop = window.matchMedia('(min-width:881px)').matches;
      if (reduced || !desktop || !window.gsap || !window.ScrollTrigger) return;
      const ctx = window.gsap.context(()=>{
        // Momento 2: las tarjetas de Soluciones retroceden al salir
        window.gsap.utils.toArray('#soluciones .v2-sol').forEach((card)=>{
          window.gsap.to(card, { y:-36, scale:0.965, opacity:0.5, ease:'none',
            scrollTrigger:{ trigger:'#soluciones', start:'bottom 85%', end:'bottom 35%', scrub:true } });
        });
        // Momento 3: el contenido del CTA converge (blur + escala) al entrar
        const cta = document.querySelector('#contacto .cta-converge');
        if (cta) window.gsap.from(cta, { opacity:0, scale:0.82, filter:'blur(10px)', ease:'power2.out',
          scrollTrigger:{ trigger:'#contacto', start:'top 80%', end:'top 38%', scrub:0.6 } });
      });
      const t = setTimeout(()=>window.ScrollTrigger && window.ScrollTrigger.refresh(), 900);
      return ()=>{ clearTimeout(t); ctx.revert(); };
    },[]);
    return null;
  };
})();
</script>

<!-- ══════════════════════════════════════════
     5.5 · LÍNEA RECTA · scroll-draw (firma de marca)
════════════════════════════════════════════ -->
<script type="text/babel">
(function(){
  const { useEffect, useRef } = React;
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  // frases laterales (se revelan palabra a palabra al scrollear)
  const LEFT_WORDS  = "Tu operativa hoy es un laberinto de tareas que se repiten.".split(' ');
  const RIGHT_WORDS = "Nuestro trabajo es trazar el camino directo — y dejar que recorra solo.".split(' ');
  const Words = ({ list }) => list.map((w, i) => (
    <React.Fragment key={i}><span className="w">{w}</span>{' '}</React.Fragment>
  ));

  window.LineaRectaSection = function LineaRectaSection() {
    const secRef   = useRef(null);
    const stageRef = useRef(null);
    const pathRef  = useRef(null);
    const nodeRef  = useRef(null);
    const ringRef  = useRef(null);
    const dotRef   = useRef(null);
    const ghostRef = useRef(null);
    const topRef   = useRef(null);
    const botRef   = useRef(null);
    const flankRef = useRef(null);
    const leftRef  = useRef(null);
    const rightRef = useRef(null);

    useEffect(() => {
      const path  = pathRef.current,  node = nodeRef.current, ring = ringRef.current,
            dot   = dotRef.current,    stage = stageRef.current,
            ghost = ghostRef.current,  top  = topRef.current,  bot  = botRef.current;
      if (!path) return;
      const len = path.getTotalLength();
      path.style.strokeDasharray  = len;
      path.style.strokeDashoffset = len;
      const place = (frac) => { const pt = path.getPointAtLength(len * frac); dot.setAttribute('cx', pt.x); dot.setAttribute('cy', pt.y); };

      // estado final (reduced-motion o sin GSAP): todo resuelto
      const setFinal = () => {
        path.style.strokeDashoffset = 0;
        if (node) { node.setAttribute('r', '13'); node.style.opacity = 1; }
        if (ring) { ring.setAttribute('r', '26'); ring.style.opacity = 1; }
        if (dot)  { place(1); dot.style.opacity = 1; }
        if (ghost) ghost.style.opacity = 0.3;
        if (top) top.style.opacity = 1;
        if (bot) bot.style.opacity = 1;
        if (stage) stage.querySelectorAll('.lr-wp').forEach(wp => { wp.setAttribute('r', '5.5'); wp.style.opacity = 1; });
        [leftRef.current, rightRef.current].forEach(el => { if (el) el.querySelectorAll('.w').forEach(w => { w.style.opacity = 1; w.style.filter = 'none'; }); });
      };
      if (reduced || !window.gsap || !window.ScrollTrigger) { setFinal(); return; }

      const ctx = window.gsap.context(() => {
        // Un único timeline scrubeado recorre la sección: el caos de arriba
        // se ordena en una línea recta que baja hasta el nodo.
        const tl = window.gsap.timeline({
          // termina ANTES de que la columna quede centrada, para poder leerlo todo ya completo
          scrollTrigger: { trigger: stage, start: 'top 88%', end: 'center 65%', scrub: 1 }
        });
        // 1 · el trazo se dibuja de arriba a abajo
        tl.fromTo(path, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 1, ease: 'none' }, 0);
        // 2 · un punto-cometa cabalga la punta del trazo
        const proxy = { p: 0 };
        tl.fromTo(proxy, { p: 0 }, { p: 1, duration: 1, ease: 'none', onUpdate(){ place(proxy.p); } }, 0);
        tl.fromTo(dot, { opacity: 0 }, { opacity: 1, duration: 0.05, ease: 'none' }, 0);
        // 3 · el laberinto fantasma aparece y luego se atenúa al ordenarse
        if (ghost) tl.fromTo(ghost, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: 'none' }, 0)
                     .to(ghost, { opacity: 0.3, duration: 0.5, ease: 'none' }, 0.3);
        // 4 · los nodos del laberinto se encienden al paso del cometa
        stage.querySelectorAll('.lr-wp').forEach(wp => {
          const f = parseFloat(wp.dataset.frac || '0');
          tl.fromTo(wp, { opacity: 0, attr: { r: 0 } },
            { opacity: 1, attr: { r: 5.5 }, duration: 0.07, ease: 'back.out(3)' }, Math.max(0, f - 0.015));
        });
        // 5 · labels caos → orden
        if (top) tl.fromTo(top, { opacity: 0, attr: { y: 48 } }, { opacity: 1, attr: { y: 58 }, duration: 0.16, ease: 'power2.out' }, 0.03);
        // 6 · el nodo final estalla al llegar la línea
        tl.fromTo(node, { opacity: 0, attr: { r: 0 } }, { opacity: 1, attr: { r: 13 }, duration: 0.2, ease: 'back.out(2.4)' }, 0.82);
        if (ring) tl.fromTo(ring, { opacity: 0, attr: { r: 8 } }, { opacity: 1, attr: { r: 26 }, duration: 0.2, ease: 'power2.out' }, 0.82);
        if (bot)  tl.fromTo(bot, { opacity: 0, attr: { y: 886 } }, { opacity: 1, attr: { y: 878 }, duration: 0.16, ease: 'power2.out' }, 0.84);

        // 7 · las frases laterales aparecen palabra a palabra al scrollear (caos → orden)
        const flank  = flankRef.current;
        const leftW  = leftRef.current  ? leftRef.current.querySelectorAll('.w')  : [];
        const rightW = rightRef.current ? rightRef.current.querySelectorAll('.w') : [];
        if (flank && (leftW.length || rightW.length)) {
          const tlw = window.gsap.timeline({
            // las frases acaban de revelarse también antes del centro
            scrollTrigger: { trigger: flank, start: 'top 84%', end: 'center 66%', scrub: 1.5 }
          });
          // cada palabra entra con un fundido largo y muy solapado → oleada fluida, no a saltos
          const wordIn  = { opacity: 0.06, filter: 'blur(8px)' };
          const wordOut = () => ({ opacity: 1, filter: 'blur(0px)', ease: 'sine.out', duration: 1.6, stagger: { each: 0.35, ease: 'sine.inOut' } });
          if (leftW.length)  tlw.fromTo(leftW,  wordIn, wordOut(), 0);
          if (rightW.length) tlw.fromTo(rightW, wordIn, wordOut(), '>-0.8');
        }
      }, stage);
      return () => ctx.revert();
    }, []);

    return (
      <section ref={secRef} id="idea" className="lr-sec">
        <div className="lr-blob" style={{width:460,height:460,left:'-8%',top:'2%',background:'rgba(99,80,170,.42)',animation:'lrFloat1 14s ease-in-out infinite'}}/>
        <div className="lr-blob" style={{width:420,height:420,right:'-6%',bottom:'-8%',background:'rgba(75,140,247,.4)',animation:'lrFloat2 17s ease-in-out infinite'}}/>
        <div className="lr-inner">
          <window.Reveal>
            <span className="lr-kicker">// la idea, en una imagen</span>
            <h2 className="lr-title">De lo enredado a lo simple. <em>Una línea recta.</em></h2>
          </window.Reveal>
          <div ref={flankRef} className="lr-flank">
            <p ref={leftRef} className="lr-side lr-side-l"><Words list={LEFT_WORDS}/></p>
            <div ref={stageRef} className="lr-stage">
            <svg className="lr-svg" viewBox="0 0 300 900" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
              <defs>
                {/* gradiente vertical: gris (caos, arriba) → azul → cian (orden, abajo) */}
                <linearGradient id="lr-grad-v" gradientUnits="userSpaceOnUse" x1="150" y1="96" x2="150" y2="840">
                  <stop offset="0" stopColor="#6E6D7E"/>
                  <stop offset="0.34" stopColor="#4B8CF7"/>
                  <stop offset="1" stopColor="#86E6FF"/>
                </linearGradient>
              </defs>
              <text ref={topRef} className="lr-axis-top" x="150" y="58" textAnchor="middle" style={{opacity:0}}>ENREDADO</text>
              {/* maze fantasma de fondo */}
              <g ref={ghostRef} style={{opacity:0}}>
                <path className="maze-ghost" d="M70 140 V220 H180 V170 H120 V274"/>
                <path className="maze-ghost" d="M214 132 V214 H90 V292 H172"/>
                <path className="maze-ghost" d="M150 116 V152 H58 V206"/>
              </g>
              {/* trazo maestro: laberinto (gris) → recta vertical (azul→cian) → nodo */}
              <path ref={pathRef} className="maze-path"
                d="M150 96 H50 V164 H250 V120 H80 V230 H264 V184 H44 V296 H210 V250 H120 V360 H150 V840"/>
              {/* nodos del laberinto que se encienden al paso del cometa */}
              <circle className="lr-wp" cx="250" cy="164" r="5.5" data-frac="0.169"/>
              <circle className="lr-wp" cx="80"  cy="230" r="5.5" data-frac="0.318"/>
              <circle className="lr-wp" cx="264" cy="184" r="5.5" data-frac="0.424"/>
              <circle className="lr-wp" cx="44"  cy="296" r="5.5" data-frac="0.576"/>
              <circle className="lr-wp" cx="210" cy="250" r="5.5" data-frac="0.674"/>
              <circle ref={ringRef} cx="150" cy="840" r="26" fill="none" stroke="rgba(134,230,255,.4)" strokeWidth="1.5" style={{opacity:0}}/>
              <circle ref={nodeRef} className="maze-node" cx="150" cy="840" r="13" fill="#86E6FF" style={{opacity:0}}/>
              <circle ref={dotRef} className="lr-traveldot" cx="150" cy="96" r="7" style={{opacity:0}}/>
              <text ref={botRef} className="lr-axis-bot" x="150" y="878" textAnchor="middle" style={{opacity:0}}>RESUELTO</text>
            </svg>
            </div>
            <p ref={rightRef} className="lr-side lr-side-r"><Words list={RIGHT_WORDS}/></p>
          </div>
        </div>
      </section>
    );
  };
})();
</script>

    },[modal]);
    useEffect(()=>{ const fn=e=>{ if(e.key==='Escape') setModal(false); }; window.addEventListener('keydown',fn); return()=>window.removeEventListener('keydown',fn); },[]);
    useEffect(()=>{ const onR=()=>setVw(window.innerWidth); window.addEventListener('resize',onR); return()=>window.removeEventListener('resize',onR); },[]);
    /* El modal se ajusta a la altura real de la demo (crece mientras se anima); cap al viewport.
       Dos fuentes: medición mismo-origen + postMessage de la demo (a prueba de orígenes). Fallback: 92vh. */
    useEffect(()=>{
      if(!modal||window.innerWidth<=860){ setFrameH(null); return; }
      let ro; const cap=()=>Math.round(window.innerHeight*0.92);
      const apply=h=>{ if(typeof h==='number'&&h>120) setFrameH(Math.min(h,cap())); };
      function fitSameOrigin(){
        const f=iframeRef.current; if(!f) return;
        try{ const d=f.contentDocument; if(d&&d.body){
          apply(Math.max(d.body.scrollHeight,(d.documentElement||{}).scrollHeight||0));

        } }catch(e){ /* distinto origen: lo resuelve el postMessage de la demo */ }
      }
      const onMsg=e=>{ const d=e&&e.data; if(d&&d.type==='mazeDemoHeight') apply(d.height); };
      window.addEventListener('message',onMsg);
      const f=iframeRef.current; const onLoad=()=>fitSameOrigin();
      if(f) f.addEventListener('load',onLoad);
      const iv=setInterval(fitSameOrigin,700); const tEnd=setTimeout(()=>clearInterval(iv),6000);
      fitSameOrigin();
      return()=>{ window.removeEventListener('message',onMsg); if(f) f.removeEventListener('load',onLoad); if(ro)ro.disconnect(); clearInterval(iv); clearTimeout(tEnd); };
    },[modal,cur,vw]);

    function switchDemo(demo){

            <div className="dp-stage">

                    {cur.live

                    <h3 className="dp-name">{cur.name}</h3>

                  <div className="dp-head-cta">
                    {cur.live

                    {cur.live && <p className="dp-time">listo en <span>{cur.time}</span></p>}
                  </div>
                </div>
                <div className="dp-steps">
                  {cur.steps.map((s,i)=>(
                    <div className="dp-step" key={i}>
                      <div className="dp-step-ic">
                        <span className="dp-step-svg" dangerouslySetInnerHTML={{__html:IC[s.ic]}}/>
                        <span className="dp-step-n">{i+1}</span>
                      </div>
                      <p className="dp-step-t">{s.t}</p>
                    </div>
                  ))}
                </div>
              </div>
              <div className="dp-footer">
                <span className="dp-hint">elige una automatización →</span>
              </div>
            </div>
            {/* ── PICKER ── */}
            <div className="dp-picker">
              {DEMOS.map(d=>(
                <div key={d.id}
                  role={d.live?'button':undefined} tabIndex={d.live?0:undefined}
                  className={'dp-card'+(d===cur?' dp-act':'')+(!d.live?' dp-dis':'')}
                  onClick={()=>switchDemo(d)}
                  onKeyDown={e=>{ if(d.live&&(e.key==='Enter'||e.key===' ')){ e.preventDefault(); switchDemo(d); } }}>
                  <span className="dp-cn">{d.num}</span>
                  <span className="dp-ci" dangerouslySetInnerHTML={{__html:IC[d.icon]}}/>
                  <span className="dp-cname">{d.name}</span>
                  {d.live
                    ? <span className="dp-livedot" aria-label="En vivo" title="En vivo"/>
                    : <span className="dp-cst soon">Próximamente</span>}
                </div>
              ))}
            </div>
            </div>
          </Reveal>
        </div>
        {modal && ReactDOM.createPortal(
          <div className="dp-modal" onClick={()=>setModal(false)}>
            <div className="dp-shell"
              style={vw>860?{maxWidth:'min(94vw, '+(cur.mw||760)+'px)'}:undefined}

              <div className="dp-frame" style={vw>860&&frameH?{height:frameH+'px'}:undefined}>
                <iframe ref={iframeRef} src={cur.url+(cur.url.indexOf('?')<0?'?':'&')+'embed=1'} title={cur.name} allow="fullscreen"/>
              </div>
            </div>

        , document.body)}

    );
  };
})();
</script>

<script type="text/babel">
(function(){
  const { useState, useEffect, useRef } = React;
  const Reveal = window.Reveal;
  const HeadReveal = window.HeadReveal;
  const fmt = n => Math.round(n).toLocaleString('es-ES');

  // cuenta animada hacia el valor objetivo (retargeting suave)
  function useCountUp(target, duration=850){
    const [display, setDisplay] = useState(0);
    const fromRef = useRef(0);
    const rafRef  = useRef(0);
    useEffect(()=>{
      const from = fromRef.current;
      const start = performance.now();
      const tick = (now)=>{
        const t = Math.min(1, (now - start) / duration);
        const e = 1 - Math.pow(1 - t, 3);
        const cur = from + (target - from) * e;
        fromRef.current = cur;
        setDisplay(cur);
        if(t < 1) rafRef.current = requestAnimationFrame(tick);
      };
      cancelAnimationFrame(rafRef.current);
      rafRef.current = requestAnimationFrame(tick);
      return ()=>cancelAnimationFrame(rafRef.current);
    }, [target, duration]);
    return display;
  }

  window.RoiSection = function RoiSection() {
    const [horas, setHoras] = useState(12);
    const [coste, setCoste] = useState(18);
    const [lvl,   setLvl]   = useState(0.85);
    const wrapRef = useRef(null);
    const [inView, setInView] = useState(false);
    useEffect(()=>{
      const io = new IntersectionObserver(([e])=>{ if(e.isIntersecting){ setInView(true); io.disconnect(); } }, { threshold:0.25 });
      if(wrapRef.current) io.observe(wrapRef.current);
      return ()=>io.disconnect();
    }, []);

    const hMonth = horas * 4.33 * lvl;          // horas recuperadas/mes
    const mMonth = hMonth * coste;              // €/mes
    const yEUR   = mMonth * 12;                 // €/año
    const dDays  = (hMonth * 12) / 8;           // días de trabajo/año liberados
    const gate   = inView ? 1 : 0;

    const cY = useCountUp(yEUR  * gate);
    const cM = useCountUp(mMonth * gate);
    const cH = useCountUp(hMonth * gate);
    const cD = useCountUp(dDays  * gate);

    const levels = [['Alta',0.85],['Media',0.6],['Baja',0.35]];
    const hPct = (horas / 40) * 100;
    const cPct = ((coste - 8) / (30 - 8)) * 100;
    const recPct = Math.round(lvl * 100);

    return (
      <section id="roi" className="roi2-sec" ref={wrapRef}>
        <div className="roi2-atmos" aria-hidden="true">
          <div className="roi2-blob" style={{width:480,height:480,background:'rgba(75,140,247,.16)',top:'-120px',left:'-60px',animation:'roi2Float 14s ease-in-out infinite'}}/>
          <div className="roi2-blob" style={{width:420,height:420,background:'rgba(99,80,170,.15)',bottom:'-150px',right:'-50px',animation:'roi2Float 17s ease-in-out infinite reverse'}}/>
        </div>
        <div className="roi2-inner">
          <HeadReveal>
            <div className="roi2-head">
              <p className="v2-kicker" style={{textAlign:'center'}}>// tu retorno de inversión · ROI</p>
              <h2 className="v2-h2" style={{whiteSpace:'nowrap',fontSize:'clamp(26px,5.6vw,69.3px)',textAlign:'center'}}>¿Cuánto te cuesta <em>hacerlo a mano?</em></h2>
              <div className="v2-h2" style={{whiteSpace:'nowrap',fontSize:'clamp(26px,5.6vw,69.3px)',textAlign:'center',marginTop:'8px'}}><em>ROI</em></div>
            </div>
          </HeadReveal>
          <Reveal delay={0.12}>
            <div className="roi2-card">
              {/* CONTROLES */}
              <div className="roi2-controls">
                <div className="roi2-field">
                  <div className="roi2-flbl"><span>Horas/semana en tareas repetitivas</span><span className="roi2-fval">{horas}<small>h</small></span></div>
                  <input className="roi2-range" type="range" min="0" max="40" step="1" value={horas}
                    style={{'--p':hPct+'%'}} onChange={e=>setHoras(+e.target.value)} aria-label="Horas por semana en tareas repetitivas"/>
                </div>
                <div className="roi2-field">
                  <div className="roi2-flbl"><span>Coste por hora de ese trabajo</span><span className="roi2-fval">{coste}<small>€</small></span></div>
                  <input className="roi2-range" type="range" min="8" max="30" step="1" value={coste}
                    style={{'--p':cPct+'%'}} onChange={e=>setCoste(+e.target.value)} aria-label="Coste por hora"/>
                </div>
                <div className="roi2-field">
                  <div className="roi2-flbl"><span>Nivel de repetición de esas tareas</span></div>
                  <div className="roi2-levels">
                    {levels.map(([lbl,v])=>(
                      <button key={lbl} type="button" className={'roi2-lvl'+(lvl===v?' active':'')} onClick={()=>setLvl(v)}>{lbl}</button>
                    ))}
                  </div>
                </div>
              </div>
              {/* RESULTADO */}
              <div className="roi2-result">
                <div className="roi2-glow" aria-hidden="true"/>
                <p className="roi2-rlabel">ROI · ahorro cada mes</p>
                <div className="roi2-big">{fmt(cM)}<span className="roi2-big-cur"> €/mes</span></div>
                <p className="roi2-sub">≈ {fmt(cY)} € al año · sobre las herramientas que ya usas</p>
                <div className="roi2-split">
                  <div className="roi2-stat">
                    <div className="n">{fmt(cH)}<small>h</small></div>
                    <div className="l">horas que recuperas<br/>al mes</div>
                  </div>
                  <div className="roi2-stat">
                    <div className="n">{fmt(cD)}<small>días</small></div>
                    <div className="l">jornadas libres<br/>al año</div>
                  </div>
                </div>
                <div className="roi2-barwrap">
                  <div className="roi2-barlbl"><span>De ese trabajo repetitivo</span><span>automatizable</span></div>
                  <div className="roi2-bar"><div className="roi2-bar-fill" style={{width:(inView?recPct:0)+'%'}}/></div>
                  <div className="roi2-barnote">Nos encargamos de ~{recPct}% de esas tareas, sin que tú toques nada.</div>
                </div>
                <div className="roi2-cta">
                  <a className="v2-btn v2-btn-accent" href="hablemos.html">→ Quiero este ahorro</a>
                  <a className="v2-btn v2-btn-ghost" href="#como">Ver cómo funciona</a>
                </div>
                <p className="roi2-note">// estimación orientativa — los números exactos los afinamos contigo, gratis</p>
              </div>
            </div>
          </Reveal>
        </div>
      </section>
    );
  };
})();
</script>

<script type="text/babel">
(function(){

  const Reveal = window.Reveal;

  window.DiagnosticoSection = function DiagnosticoSection() {
    const [answers, setAnswers] = useState({q1:null,q2:null,q3:null});

    }, [res]);
    function choose(qid, val){
      setAnswers(a=>({ ...a, [qid]: val }));

            <div style={{display:'flex',flexDirection:'column',gap:14,marginTop:28}}>
              {QS.map((Q,i)=>{
                const isOpen = openQ===Q.id;
                return (
                  <div key={Q.id} className={'v2-diag-q'+(isOpen?' open':'')}>
                    <div className="v2-diag-head" role="button" tabIndex={0} aria-expanded={isOpen}
                      onClick={()=>setOpenQ(isOpen?null:Q.id)}
                      onKeyDown={e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); setOpenQ(isOpen?null:Q.id); } }}>
                      <span className="v2-diag-num">{'0'+(i+1)}</span>

                      <div className="v2-diag-opts">
                        {Q.opts.map(([v,label])=>{

                          return (
                            <div key={v} className={'v2-diag-opt'+(sel?' sel':'')} role="button" tabIndex={0}
                              onClick={()=>choose(Q.id,v)} onKeyDown={e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); choose(Q.id,v); } }}>
                              <span className="v2-diag-check">{sel && <window.IconCheck/>}</span>
                              {label}

            </div>
            {res && (
              <div className="v2-diag-result" ref={resRef}>

  };
})();
</script>

<script type="text/babel">
(function(){
  const { useState, useEffect, useRef } = React;
  const motion = window.Motion.motion;
  const PRE_VIDEO  = "assets/referencias/referencia-cubo-cristal-01-4k60-loop.mp4";
  const PRE_POSTER = "assets/referencias/poster-cubo-carga.jpg";

  // Laberinto boustrophedon: la línea azul cruza cada pared por su hueco
  function MazeSolve() {
    return (
      <svg viewBox="0 0 240 240" width="100%" height="100%" style={{display:'block',overflow:'visible'}}>
        {/* paredes del laberinto (tenues) */}
        <g stroke="rgba(255,255,255,.16)" strokeWidth="2" fill="none" strokeLinecap="round">
          <rect x="2" y="2" width="236" height="236" rx="8"/>
          <line x1="0"  y1="42"  x2="198" y2="42"/>
          <line x1="42" y1="82"  x2="240" y2="82"/>
          <line x1="0"  y1="122" x2="198" y2="122"/>
          <line x1="42" y1="162" x2="240" y2="162"/>
          <line x1="0"  y1="202" x2="198" y2="202"/>
        </g>
        {/* estela tenue del recorrido completo */}
        <path d="M20 22 H220 V62 H20 V102 H220 V142 H20 V182 H220 V222 H20"
          fill="none" stroke="var(--accent)" strokeOpacity=".14" strokeWidth="4"
          strokeLinecap="round" strokeLinejoin="round"/>
        {/* línea recta que resuelve el laberinto */}
        <motion.path d="M20 22 H220 V62 H20 V102 H220 V142 H20 V182 H220 V222 H20"
          fill="none" stroke="var(--accent)" strokeWidth="4.5"
          strokeLinecap="round" strokeLinejoin="round"
          style={{filter:'drop-shadow(0 0 5px var(--accent)) drop-shadow(0 0 12px rgba(75,140,247,.55))'}}
          initial={{pathLength:0,opacity:.9}} animate={{pathLength:1,opacity:1}}
          transition={{duration:3.4,ease:'easeInOut'}}/>
      </svg>
    );
  }

  function Preloader() {
    const [pct, setPct]   = useState(0);
    const [hide, setHide] = useState(false);
    const [gone, setGone] = useState(false);
    const vref = useRef(null);

    useEffect(() => { const v = vref.current; if (v) v.play().catch(()=>{}); }, []);

    // contador sincronizado con el trazo (easeInOut)
    useEffect(() => {
      const DUR = 3400, start = performance.now(); let raf;
      const tick = (t) => {
        const p = Math.min(1, (t - start) / DUR);
        const e = p < 0.5 ? 2*p*p : 1 - Math.pow(-2*p + 2, 2) / 2;
        setPct(Math.round(e * 100));
        if (p < 1) raf = requestAnimationFrame(tick);
      };
      raf = requestAnimationFrame(tick);
      return () => cancelAnimationFrame(raf);
    }, []);

    // cierra cuando el trazo termina Y la página está lista
    useEffect(() => {
      let done = false;
      const finish = () => { if (done) return; done = true; setHide(true); setTimeout(() => setGone(true), 1300); };
      const t = setTimeout(() => {
        if (document.readyState === 'complete') finish();
        else window.addEventListener('load', finish, { once: true });
      }, 3700);
      return () => clearTimeout(t);
    }, []);

    // bloquea el scroll del body mientras el preloader está activo
    useEffect(() => {
      document.body.style.overflow = gone ? '' : 'hidden';
    }, [gone]);

    if (gone) return null;
    return (
      <motion.div animate={{opacity: hide ? 0 : 1}} transition={{duration: 1.2, ease: [0.4, 0, 0.2, 1]}}
        style={{position:'fixed',inset:0,zIndex:9999,background:'#08070C',overflow:'hidden',
          display:'flex',alignItems:'center',justifyContent:'center',pointerEvents: hide ? 'none' : 'auto'}}>
        {/* mismo vídeo del cubo, limpio */}
        <video ref={vref} src={PRE_VIDEO} poster={PRE_POSTER} muted playsInline loop autoPlay preload="auto"
          style={{position:'absolute',inset:0,width:'100%',height:'100%',objectFit:'cover'}} />
        <div style={{position:'absolute',inset:0,
          background:'radial-gradient(120% 120% at 50% 50%, rgba(8,7,12,.42) 0%, rgba(8,7,12,.84) 100%)'}}/>
        <div style={{position:'relative',zIndex:2,display:'flex',flexDirection:'column',alignItems:'center',gap:26}}>
          <div style={{width:'clamp(180px,40vw,256px)',aspectRatio:'1'}}><MazeSolve/></div>
          <div style={{fontFamily:'JetBrains Mono',fontSize:12.6,letterSpacing:'.2em',
            textTransform:'uppercase',color:'rgba(255,255,255,.62)'}}>
            Trazando la línea recta · {pct}%
          </div>
        </div>
      </motion.div>
    );
  }
  window.Preloader = Preloader;
})();
</script>

<script type="text/babel">
(function(){
  const { useEffect, useRef } = React;
  const _ce = console.error;
  console.error = (...a) => { if (typeof a[0]==='string' && a[0].includes('Each child in a list')) return; _ce(...a); };
  const MotionConfig = window.Motion.MotionConfig;

  // ── ScrollSmoother · scroll suave en toda la web ──
  // Envuelve #smooth-content (transformado) dentro de #smooth-wrapper (fijo).
  // Los elementos position:fixed (preloader, barra de progreso, modal) viven
  // FUERA de #smooth-content para no heredar el transform.
  function SmoothScroll() {
    useEffect(() => {
      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduced || !window.gsap || !window.ScrollTrigger || !window.ScrollSmoother) return;
      window.gsap.registerPlugin(window.ScrollTrigger, window.ScrollSmoother);
      const smoother = window.ScrollSmoother.create({
        wrapper: '#smooth-wrapper',
        content: '#smooth-content',
        smooth: 1.2,          // segundos de "catch-up" del contenido
        effects: true,        // habilita data-speed / data-lag
        smoothTouch: 0.1,     // suavizado ligero en táctil
      });
      const refresh = () => window.ScrollTrigger.refresh();
      window.addEventListener('load', refresh);
      const t = setTimeout(refresh, 1000);
      return () => { window.removeEventListener('load', refresh); clearTimeout(t); if (smoother) smoother.kill(); };
    }, []);
    return null;
  }

  // ── Cursor de marca · halo que sigue al ratón y reacciona en los puntos interactivos ──
  // Vive FUERA de #smooth-content (es position:fixed). Solo ratón (pointer:fine).
  function MazeCursor() {
    const ringRef = useRef(null);
    const dotRef  = useRef(null);
    useEffect(() => {
      const fine = window.matchMedia('(pointer: fine)').matches;
      if (!fine || !window.gsap) return;
      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const gsap = window.gsap;
      const ring = ringRef.current, dot = dotRef.current;
      gsap.set([ring, dot], { xPercent: -50, yPercent: -50 });
      const dR = reduced ? 0.12 : 0.6, dD = reduced ? 0.05 : 0.16;
      const xR = gsap.quickTo(ring, 'x', { duration: dR, ease: 'power3' });
      const yR = gsap.quickTo(ring, 'y', { duration: dR, ease: 'power3' });
      const xD = gsap.quickTo(dot,  'x', { duration: dD, ease: 'power3' });
      const yD = gsap.quickTo(dot,  'y', { duration: dD, ease: 'power3' });
      const SEL = 'a, button, [data-cursor], .magnetic, .dp-btn, .dp-card, .v2-sol, .v2-btn, .v2-demolink, .v2-diag-q, .mq-chip, input, textarea, label, summary';
      let shown = false;
      const move = (e) => {
        if (!shown) { shown = true; gsap.to([ring, dot], { autoAlpha: 1, duration: 0.3 }); }
        xR(e.clientX); yR(e.clientY); xD(e.clientX); yD(e.clientY);
      };
      const over = (e) => { const el = e.target.closest && e.target.closest(SEL);
        if (el) gsap.to(ring, { scale: 2, borderColor: 'rgba(134,230,255,.9)', backgroundColor: 'rgba(75,140,247,.14)', duration: 0.3, ease: 'power3' }); };
      const out  = (e) => { const el = e.target.closest && e.target.closest(SEL);
        if (el && !(e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest(SEL)))
          gsap.to(ring, { scale: 1, borderColor: 'rgba(75,140,247,.55)', backgroundColor: 'rgba(75,140,247,0)', duration: 0.3, ease: 'power3' }); };
      const leave = () => gsap.to([ring, dot], { autoAlpha: 0, duration: 0.25 });
      const down  = () => gsap.to(ring, { scale: 0.8, duration: 0.15 });
      const up    = () => gsap.to(ring, { scale: 1, duration: 0.25, ease: 'back.out(2)' });
      window.addEventListener('pointermove', move, { passive: true });
      document.addEventListener('mouseover', over);
      document.addEventListener('mouseout', out);
      document.documentElement.addEventListener('mouseleave', leave);
      window.addEventListener('mousedown', down);
      window.addEventListener('mouseup', up);
      return () => {
        window.removeEventListener('pointermove', move);
        document.removeEventListener('mouseover', over);
        document.removeEventListener('mouseout', out);
        document.documentElement.removeEventListener('mouseleave', leave);
        window.removeEventListener('mousedown', down);
        window.removeEventListener('mouseup', up);
        gsap.killTweensOf([ring, dot]);
      };
    }, []);
    return (
      <React.Fragment>
        <div ref={ringRef} className="mz-cursor-ring" aria-hidden="true"/>
        <div ref={dotRef}  className="mz-cursor-dot"  aria-hidden="true"/>
      </React.Fragment>
    );
  }

  function App() {
    return (
      <MotionConfig reducedMotion="user">
        <SmoothScroll/>
        <MazeCursor/>
        <window.Preloader/>
        <div id="smooth-wrapper">
          <div id="smooth-content">
            <window.ScrollFX/>
            <window.CinematicTransitions/>
            <window.HeroSection/>
            <window.LineaRectaSection/>
            <window.MarqueeSection/>
            <window.ComoFuncionaSection/>
            <window.RoiSection/>
            <window.ServiciosSection/>
            <window.SolucionesSection/>
            <window.PorQueSection/>
            <window.DiagnosticoSection/>
            <window.CtaSection/>
            <window.Footer/>
          </div>
        </div>
      </MotionConfig>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App, null));
})();
</script>
