<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mazestudio · página no encontrada</title>
<meta name="description" content="Esta página se perdió en el laberinto. Vuelve al inicio de Mazestudio o escríbenos.">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#0B0C10">
<link rel="icon" href="favicon.svg" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;450;500;600&family=JetBrains+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0C10;
    --bg-2:#0F1116;
    --surface:#14161E;
    --surface-2:#191C26;
    --ink:#ECEDF2;
    --ink-mut:#9498A8;
    --ink-dim:#696D7C;
    --line:rgba(255,255,255,.07);
    --line-2:rgba(255,255,255,.14);
    --accent:#4361F0;
    --accent-deep:#2D4ECC;
    --accent-soft:#8295F2;
    --accent-wash:rgba(67,97,240,.12);
    --wa:#25D366;

    --display:'Space Grotesk', system-ui, sans-serif;
    --serif:'Fraunces', 'Times New Roman', Georgia, serif;
    --sans:'Inter', system-ui, sans-serif;
    --mono:'JetBrains Mono', ui-monospace, monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);color:var(--ink);font-family:var(--sans);
    line-height:1.55;-webkit-font-smoothing:antialiased;letter-spacing:-.005em;
    min-height:100dvh;overflow-x:hidden;position:relative;
    display:flex;align-items:center;justify-content:center;
  }
  img,svg{max-width:100%;}
  a{color:inherit;text-decoration:none;}

  /* halo de fondo cobalto */
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(60% 50% at 50% 38%, rgba(67,97,240,.16), transparent 70%),
      radial-gradient(40% 40% at 80% 90%, rgba(67,97,240,.08), transparent 70%);
  }

  /* grano / textura de film */
  .grain{
    position:fixed; inset:-50%; z-index:1; pointer-events:none;
    width:200%; height:200%; opacity:.05; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    background-size:160px 160px;
  }
  @media (prefers-reduced-motion:no-preference){
    .grain{animation:grain 1.1s steps(5) infinite;}
  }
  @keyframes grain{
    0%{transform:translate(0,0)} 20%{transform:translate(-4%,3%)}
    40%{transform:translate(3%,-4%)} 60%{transform:translate(-3%,2%)}
    80%{transform:translate(4%,-2%)} 100%{transform:translate(0,0)}
  }

  /* botón de idioma (muy visible) */
  .lang-toggle{position:fixed;top:20px;right:22px;z-index:10;display:inline-flex;align-items:center;gap:7px;cursor:pointer;
    font-family:var(--mono);font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
    color:var(--ink);background:var(--surface);border:1px solid var(--accent);border-radius:30px;
    padding:7px 12px;line-height:1;box-shadow:0 0 0 3px var(--accent-wash);
    transition:background .2s ease,border-color .2s ease,color .2s ease,box-shadow .2s ease,transform .15s ease;}
  .lang-toggle:hover{background:var(--accent);border-color:var(--accent);color:#fff;transform:translateY(-1px);box-shadow:0 9px 24px -8px var(--accent);}
  .lang-toggle svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6;flex:0 0 auto;}
  .lang-toggle .lt-cur{font-weight:700;}

  /* tarjeta central */
  .card{
    position:relative;z-index:5;width:100%;max-width:580px;
    padding:48px 28px;text-align:center;
    animation:rise .7s cubic-bezier(.22,1,.36,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:none;}}

  /* logo */
  .logo{display:inline-flex;align-items:center;gap:15px;margin-bottom:42px;}
  .logo svg{display:block;height:34px;width:auto;overflow:visible;}
  .logo .hilo{fill:none;stroke:var(--ink);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;}
  .logo .nd{fill:var(--bg);stroke:var(--ink);stroke-width:2.4;}
  .logo .nd.end{fill:var(--accent);stroke:none;}
  .logo .wm{font-family:var(--display);font-weight:600;font-size:30px;letter-spacing:-.02em;color:var(--ink);}
  .logo .wm .dot{color:var(--accent);}

  /* número 404 con hilo de laberinto perdido */
  .code{position:relative;display:inline-block;margin-bottom:6px;}
  .code .num{
    font-family:var(--display);font-weight:700;
    font-size:clamp(96px,26vw,180px);line-height:.9;letter-spacing:-.04em;
    color:transparent;
    background:linear-gradient(180deg, var(--ink) 0%, var(--ink-dim) 120%);
    -webkit-background-clip:text;background-clip:text;
  }
  .code .num em{
    font-family:var(--serif);font-style:italic;font-weight:600;
    -webkit-text-fill-color:var(--accent-soft);
  }
  /* hilo del laberinto que se sale del cuadro: el camino que se perdió */
  .maze{position:absolute;left:50%;bottom:-14px;transform:translateX(-50%);width:min(340px,86%);height:46px;z-index:-1;opacity:.55;}
  .maze path{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;
    stroke-dasharray:6 9;}
  @media (prefers-reduced-motion:no-preference){
    .maze path{animation:flow 2.4s linear infinite;}
  }
  @keyframes flow{to{stroke-dashoffset:-30;}}

  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent-soft);margin:30px 0 16px;}
  h1{font-family:var(--display);font-weight:600;font-size:clamp(26px,5.6vw,38px);line-height:1.08;letter-spacing:-.025em;margin-bottom:14px;}
  h1 em{font-family:var(--serif);font-style:italic;font-weight:500;color:var(--accent-soft);}
  .sub{font-size:16px;color:var(--ink-mut);max-width:440px;margin:0 auto 38px;}

  /* botones de acción */
  .actions{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;}
  .btn{
    display:inline-flex;align-items:center;gap:10px;
    padding:14px 24px;border-radius:13px;
    font-family:var(--display);font-weight:600;font-size:15.5px;letter-spacing:-.01em;
    border:1px solid var(--line-2);background:var(--surface);
    transition:transform .18s, background .18s, border-color .18s, box-shadow .18s, color .18s;
  }
  .btn .ar{font-family:var(--mono);transition:transform .18s;}
  .btn:hover{transform:translateY(-3px);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 16px 40px -18px var(--accent);}
  .btn.primary:hover{background:var(--accent-deep);box-shadow:0 20px 48px -16px var(--accent);}
  .btn.primary:hover .ar{transform:translateX(-3px);}
  .btn.ghost:hover{border-color:var(--accent);background:var(--accent-wash);color:var(--ink);}
  .btn.ghost:hover .ar{transform:translateX(4px);}

  .note{margin-top:36px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--ink-dim);}

  @media (max-width:480px){
    .card{padding:40px 20px;}
    .logo{margin-bottom:34px;}
    .actions{flex-direction:column;}
    .btn{justify-content:center;}
  }
</style>
</head>
<body>
<div class="grain"></div>

<button class="lang-toggle" id="langToggle" type="button" aria-label="Cambiar idioma · Switch language" data-i18n-skip>
  <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.9 2.6 15.1 0 18M12 3c-2.6 2.9-2.6 15.1 0 18"/></svg>
  <span class="lt-cur">EN</span>
</button>

<main class="card">
  <a class="logo" href="mazestudio-web.html" data-home aria-label="Mazestudio">
    <svg viewBox="0 0 132 52" aria-hidden="true">
      <path class="hilo" d="M3 44 L3 31 L19 31 L19 15 L33 15 L33 35 L47 35 L47 9 L61 9 L61 27 L75 27 L75 44 L129 44"/>
      <circle class="nd" cx="3"  cy="44" r="4"/>
      <circle class="nd" cx="33" cy="15" r="3.2"/>
      <circle class="nd" cx="47" cy="9"  r="3.2"/>
      <circle class="nd" cx="75" cy="44" r="3.2"/>
      <circle class="nd end" cx="129" cy="44" r="4.4"/>
    </svg>
    <span class="wm">Mazestudio<span class="dot">.</span></span>
  </a>

  <div class="code">
    <span class="num">4<em>0</em>4</span>
    <svg class="maze" viewBox="0 0 340 46" aria-hidden="true">
      <path d="M2 24 L40 24 L40 8 L78 8 L78 38 L116 38 L116 16 L154 16 L154 32 L192 32 L192 6 L230 6 L230 40 L268 40 L268 22 L338 22"/>
    </svg>
  </div>

  <p class="eyebrow">// error 404</p>
  <h1>Esta página se perdió en el <em>laberinto</em></h1>
  <p class="sub">El enlace que seguías no existe o se ha movido. No te preocupes: te llevamos de vuelta al camino correcto.</p>

  <div class="actions">
    <a class="btn primary" href="mazestudio-web.html" data-home>
      <span class="ar">←</span> Volver al inicio
    </a>
    <a class="btn ghost" href="hablemos.html">
      Hablemos <span class="ar">→</span>
    </a>
  </div>

  <p class="note">Mazestudio · automatización con IA</p>
</main>

<script>
  /* "Volver al inicio" → home correcta (local: mazestudio-web.html · producción: /).
     "Hablemos" usa hablemos.html, que funciona igual en ambos entornos. */
  (function(){
    var home = (location.protocol === 'file:') ? 'mazestudio-web.html' : '/';
    document.querySelectorAll('a[data-home]').forEach(function(a){ a.setAttribute('href', home); });
  })();
</script>

<script>
/* ——— TRADUCTOR ES⇄EN (misma lógica que la web) ——— */
(function(){
  'use strict';
  var DICT = {
    "// error 404":"// error 404",
    "Esta página se perdió en el":"This page got lost in the",
    "laberinto":"maze",
    "El enlace que seguías no existe o se ha movido. No te preocupes: te llevamos de vuelta al camino correcto.":"The link you followed doesn't exist or has moved. Don't worry — we'll take you back on track.",
    "Volver al inicio":"Back to home",
    "Hablemos":"Let's talk",
    "Mazestudio · automatización con IA":"Mazestudio · AI automation"
  };
  var lang = 'es', orig = new WeakMap();
  function accept(n){ var p=n.parentNode; if(!p) return false; var t=p.nodeName; if(t==='SCRIPT'||t==='STYLE') return false; if(p.nodeType===1 && p.closest && p.closest('[data-i18n-skip]')) return false; return !!(n.nodeValue && n.nodeValue.trim()); }
  function tr(n){ if(lang!=='en' || !accept(n)) return; var k=n.nodeValue.trim(); var en=DICT[k]; if(en===undefined) return; orig.set(n, n.nodeValue); if(n.nodeValue!==en) n.nodeValue=en; }
  function walk(root, fn){ if(root.nodeType===3){ fn(root); return; } var w=document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null), x; while((x=w.nextNode())) fn(x); }

  function toEN(){ lang='en'; document.documentElement.lang='en'; document.title="Mazestudio · page not found"; walk(document.body, tr); }
  function toES(){ lang='es'; document.documentElement.lang='es'; document.title='Mazestudio · página no encontrada'; walk(document.body, function(n){ if(orig.has(n)){ var o=orig.get(n); if(n.nodeValue!==o) n.nodeValue=o; } }); }

  var btn = document.getElementById('langToggle'), cur = btn ? btn.querySelector('.lt-cur') : null;
  function apply(l, save){ if(l==='en'){ toEN(); if(cur) cur.textContent='ES'; } else { toES(); if(cur) cur.textContent='EN'; } if(save){ try{ localStorage.setItem('mz_lang', l); }catch(e){} } }
  if(btn) btn.addEventListener('click', function(){ apply(lang==='en' ? 'es' : 'en', true); });
  var saved = 'es'; try{ saved = localStorage.getItem('mz_lang') || 'es'; }catch(e){}
  if(saved === 'en') apply('en', false);
})();
</script>

</body>
</html>
