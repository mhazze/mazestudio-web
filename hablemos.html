<style>
  :root{
    --bg:#0B0C10;
    --bg-2:#0F1116;
    --surface:#14161E;
    --surface-2:#191C26;
    --ink:#ECEDF2;
    --ink-mut:#9498A8;
    --ink-dim:#696D7C;
    --line:rgba(255,255,255,.07);
    --line-2:rgba(255,255,255,.14);
    --accent:#4361F0;
    --accent-deep:#2D4ECC;
    --accent-soft:#8295F2;
    --accent-wash:rgba(67,97,240,.12);
    --wa:#25D366;

    --display:'Space Grotesk', system-ui, sans-serif;
    --serif:'Fraunces', 'Times New Roman', Georgia, serif;
    --sans:'Inter', system-ui, sans-serif;
    --mono:'JetBrains Mono', ui-monospace, monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);color:var(--ink);font-family:var(--sans);
    line-height:1.55;-webkit-font-smoothing:antialiased;letter-spacing:-.005em;
    min-height:100dvh;overflow-x:hidden;position:relative;
    display:flex;align-items:center;justify-content:center;
  }
  img,svg{max-width:100%;}
  a{color:inherit;text-decoration:none;}

  /* halo de fondo cobalto */
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(60% 50% at 50% 38%, rgba(67,97,240,.16), transparent 70%),
      radial-gradient(40% 40% at 80% 90%, rgba(67,97,240,.08), transparent 70%);
  }

  /* grano / textura de film */
  .grain{
    position:fixed; inset:-50%; z-index:1; pointer-events:none;
    width:200%; height:200%; opacity:.05; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    background-size:160px 160px;
  }
  @media (prefers-reduced-motion:no-preference){
    .grain{animation:grain 1.1s steps(5) infinite;}
  }
  @keyframes grain{
    0%{transform:translate(0,0)} 20%{transform:translate(-4%,3%)}
    40%{transform:translate(3%,-4%)} 60%{transform:translate(-3%,2%)}
    80%{transform:translate(4%,-2%)} 100%{transform:translate(0,0)}
  }

  /* volver */
  .back{
    position:fixed;top:24px;left:26px;z-index:10;
    display:inline-flex;align-items:center;gap:8px;
    font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--ink-mut);transition:color .2s,transform .2s;
  }
  .back:hover{color:var(--ink);transform:translateX(-3px);}

  /* tarjeta central */
  .card{
    position:relative;z-index:5;width:100%;max-width:560px;
    padding:48px 28px;text-align:center;
    animation:rise .7s cubic-bezier(.22,1,.36,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:none;}}

  /* logo */
  .logo{display:inline-flex;align-items:center;gap:15px;margin-bottom:40px;}
  .logo svg{display:block;height:34px;width:auto;overflow:visible;}
  .logo .hilo{fill:none;stroke:var(--ink);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;}
  .logo .nd{fill:var(--bg);stroke:var(--ink);stroke-width:2.4;}
  .logo .nd.end{fill:var(--accent);stroke:none;}
  .logo .wm{font-family:var(--display);font-weight:600;font-size:30px;letter-spacing:-.02em;color:var(--ink);}
  .logo .wm .dot{color:var(--accent);}

  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent-soft);margin-bottom:18px;}
  h1{font-family:var(--display);font-weight:600;font-size:clamp(30px,7vw,46px);line-height:1.05;letter-spacing:-.025em;margin-bottom:14px;}
  h1 em{font-family:var(--serif);font-style:italic;font-weight:500;color:var(--accent-soft);}
  .sub{font-size:16px;color:var(--ink-mut);max-width:420px;margin:0 auto 38px;}

  /* botones de acción */
  .actions{display:flex;flex-direction:column;gap:14px;max-width:400px;margin:0 auto;}
  .opt{
    display:flex;align-items:center;gap:16px;text-align:left;
    padding:18px 22px;border-radius:14px;
    border:1px solid var(--line-2);background:var(--surface);
    transition:transform .18s, background .18s, border-color .18s, box-shadow .18s;
  }
  .opt:hover{transform:translateY(-3px);}
  .opt .ic{flex:0 0 auto;width:44px;height:44px;border-radius:11px;display:grid;place-items:center;}
  .opt .ic svg{width:24px;height:24px;display:block;}
  .opt .tx{display:flex;flex-direction:column;gap:1px;}
  .opt .tx b{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:-.01em;}
  .opt .tx span{font-size:13px;color:var(--ink-mut);}
  .opt .go{margin-left:auto;font-family:var(--mono);font-size:15px;color:var(--ink-dim);transition:transform .18s,color .18s;}
  .opt:hover .go{transform:translateX(4px);color:var(--ink);}

  .opt.wa:hover{border-color:var(--wa);background:rgba(37,211,102,.08);box-shadow:0 16px 40px -18px var(--wa);}
  .opt.wa .ic{background:rgba(37,211,102,.14);}
  .opt.wa .ic svg{fill:var(--wa);}

  .opt.mail:hover{border-color:var(--accent);background:var(--accent-wash);box-shadow:0 16px 40px -18px var(--accent);}
  .opt.mail .ic{background:var(--accent-wash);}
  .opt.mail .ic svg{stroke:var(--accent-soft);fill:none;stroke-width:1.8;}

  .note{margin-top:34px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--ink-dim);}
  .legalmini{margin-top:20px;display:flex;justify-content:center;gap:16px;flex-wrap:wrap;
    font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;}
  .legalmini a{color:var(--ink-dim);transition:color .2s;}
  .legalmini a:hover{color:var(--ink-mut);}

  @media (max-width:480px){
    .card{padding:40px 20px;}
    .logo{margin-bottom:32px;}
  }
</style>
</head>
