# Bloque de contenido = default_server: sirve el apex mazestudio.site y
# cualquier host que no sea www (importante: sin esto, el apex caía en el
# bloque www y entraba en bucle de redirección).
server {
    listen       80 default_server;
    listen  [::]:80 default_server;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # ── Cabeceras de seguridad ──────────────────────────────────────
    # `always` es imprescindible: sin él nginx NO las añade a las
    # respuestas de error (404/50x), que aquí son páginas propias.
    # TLS lo termina Dokploy/Traefik por delante; este bloque escucha
    # en :80, pero la cabecera viaja igual hasta el navegador.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
    # CSP probada localmente con Playwright contra las 7 páginas (home, /en,
    # hablemos, 3 legales, 404): cero violaciones en consola. 'unsafe-inline'
    # en script-src hace falta por los <script> inline de bootstrap (idioma,
    # fallback de framer-motion) y en style-src por los estilos inline que
    # genera React — son muchos y dinámicos, hashearlos uno a uno no es
    # razonable. img-src incluye data: por la textura de ruido SVG inline de
    # hablemos.html/404.html. Sin más orígenes de terceros: los iconos de
    # integraciones ya se auto-alojan.
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'none'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    # Páginas servidas tal cual; si no existe el recurso -> 404 personalizado.
    # $uri.html permite URLs sin extensión: /en sirve en.html. Se hace así, y
    # no con un directorio /en/, para que /en resuelva las rutas RELATIVAS
    # (assets/, favicon.svg…) contra la raíz igual que la home — de ese modo
    # las dos versiones comparten el mismo assets/app.js sin reescribir nada.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Una sola URL por idioma: /en.html y /en/ redirigen a /en (que es lo que
    # dicen el canonical, el hreflang y el sitemap).
    location = /en.html { return 301 /en; }
    location = /en/     { return 301 /en; }

    # Página de error 404 de Mazestudio (laberinto).
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Errores de servidor: usa la 50x.html que trae la imagen base de nginx.
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
    }
}

# Redirección canónica para SEO: solo www -> apex (301, conserva la ruta).
# NO es default_server, así solo actúa sobre el Host www.mazestudio.site.
server {
    listen       80;
    listen  [::]:80;
    server_name  www.mazestudio.site;
    return 301 https://mazestudio.site$request_uri;
}
