# Bloque de contenido = default_server: sirve el apex mazestudio.site y
# cualquier host que no sea www (importante: sin esto, el apex caía en el
# bloque www y entraba en bucle de redirección).
server {
    listen       80 default_server;
    listen  [::]:80 default_server;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # ── Ficheros ocultos ────────────────────────────────────────────
    # Segunda linea de defensa tras el .dockerignore: si algun dia se
    # vuelve a colar un .git/.env en la imagen, aqui no sale. `^~` para
    # que gane a las regex de cache de mas abajo.
    # /.well-known/ SI se sirve: por ahi valida Let's Encrypt. Va antes
    # porque nginx elige el prefijo `^~` mas largo que encaje. Sin esta
    # linea, una renovacion fallida no daria la cara hasta que caduque.
    location ^~ /.well-known/ { }
    location ^~ /.           { return 404; }

    # ── Compresión ──────────────────────────────────────────────────
    # La imagen nginx:alpine trae `gzip on` COMENTADO en su nginx.conf, así
    # que hasta el 7 ago 2026 se servía TODO en crudo: ~620 KB de texto por
    # primera visita (index.html 108 KB, app.js 103 KB, vendor 401 KB).
    # Con gzip -6 eso baja a ~180 KB. Era la causa nº1 del Performance
    # móvil de 48/100 en PageSpeed.
    # text/html NO se lista a propósito: nginx siempre lo comprime y avisa
    # si se declara. Brotli no está: necesita módulo compilado, y gzip ya
    # da el grueso del ahorro.
    gzip              on;
    gzip_vary         on;          # Vary: Accept-Encoding, para cachés intermedias
    gzip_comp_level   6;           # 9 cuesta bastante CPU y ahorra <2%
    gzip_min_length   256;
    gzip_proxied      any;         # Dokploy/Traefik va por delante
    gzip_types        text/plain text/css application/javascript
                      application/json image/svg+xml application/xml text/xml;

    # ── Caché de assets ─────────────────────────────────────────────
    # Antes NINGÚN asset llevaba Cache-Control (solo ETag), así que cada
    # visita revalidaba los 4 MB de vendor, fuentes y vídeo del cubo.
    #
    # OJO al tocar esto: aquí se usa SOLO `expires`, nunca `add_header`.
    # Un `add_header` dentro de un location ANULA toda la lista heredada
    # del server — dejaría sin CSP ni HSTS todos los JS, fuentes e
    # imágenes del sitio. `expires` es de otro módulo y no rompe la
    # herencia. El precio de no poder usar `immutable` son revalidaciones
    # 304 sueltas (~0 bytes); no compensa arriesgar la CSP.
    #
    # app.js NO lleva hash en el nombre (WEB/build.mjs), así que un año lo
    # dejaría desactualizado en los recurrentes tras cada deploy: 1 h.
    location = /assets/app.js { expires 1h; }
    # El resto son estables (vendor, fuentes, vídeo, imágenes). Regla al
    # regenerar cualquiera de ellos: CAMBIAR EL NOMBRE, o los visitantes
    # recurrentes seguirán con el viejo hasta un año.
    location ~* \.(js|css|woff2|woff|svg|webp|jpg|jpeg|png|mp4|ico)$ {
        expires 1y;
    }
    # .html, .xml y .txt quedan fuera a propósito: sin Cache-Control el
    # navegador revalida, que es lo que se quiere en index.html,
    # sitemap.xml y robots.txt.

    # ── Cabeceras de seguridad ──────────────────────────────────────
    # `always` es imprescindible: sin él nginx NO las añade a las
    # respuestas de error (404/50x), que aquí son páginas propias.
    # TLS lo termina Dokploy/Traefik por delante; este bloque escucha
    # en :80, pero la cabecera viaja igual hasta el navegador.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
    # CSP probada localmente con Playwright contra las 7 páginas (home, /en,
    # hablemos, 3 legales, 404): cero violaciones en consola. 'unsafe-inline'
    # en script-src hace falta por los <script> inline de bootstrap (idioma,
    # fallback de framer-motion) y en style-src por los estilos inline que
    # genera React — son muchos y dinámicos, hashearlos uno a uno no es
    # razonable. img-src incluye data: por la textura de ruido SVG inline de
    # hablemos.html/404.html. Sin más orígenes de terceros: los iconos de
    # integraciones ya se auto-alojan. frame-src permite *.demos.mazestudio.site
    # porque la galería de demos y el CRM se abren en un <iframe> hacia esos
    # subdominios (crm.demos, gestion.demos...); con 'none' el modal nunca
    # cargaba nada — el Playwright de antes nunca abrió el modal, solo
    # comprobó las 7 páginas en carga inicial.
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src https://*.demos.mazestudio.site; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    # Páginas servidas tal cual; si no existe el recurso -> 404 personalizado.
    # $uri.html permite URLs sin extensión: /en sirve en.html. Se hace así, y
    # no con un directorio /en/, para que /en resuelva las rutas RELATIVAS
    # (assets/, favicon.svg…) contra la raíz igual que la home — de ese modo
    # las dos versiones comparten el mismo assets/app.js sin reescribir nada.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Una sola URL por idioma: /en.html y /en/ redirigen a /en (que es lo que
    # dicen el canonical, el hreflang y el sitemap).
    #
    # absolute_redirect off es imprescindible aquí: por defecto nginx
    # convierte el `return 301 /en` relativo en absoluto usando el esquema
    # de SU socket, que es :80 — TLS lo termina Traefik por delante. Sin
    # esto, /en.html devolvía Location: http://mazestudio.site/en, un
    # salto a HTTP en medio de la cadena de redirección (detectado en la
    # auditoría del 7 ago 2026). Con `off` emite el Location relativo y el
    # esquema lo pone el navegador: https.
    absolute_redirect off;
    location = /en.html { return 301 /en; }
    location = /en/     { return 301 /en; }

    # Página de error 404 de Mazestudio (laberinto).
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Errores de servidor: usa la 50x.html que trae la imagen base de nginx.
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
    }
}

# Redirección canónica para SEO: solo www -> apex (301, conserva la ruta).
# NO es default_server, así solo actúa sobre el Host www.mazestudio.site.
server {
    listen       80;
    listen  [::]:80;
    server_name  www.mazestudio.site;
    return 301 https://mazestudio.site$request_uri;
}
