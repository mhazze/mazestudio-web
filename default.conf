# Bloque de contenido = default_server: sirve el apex mazestudio.site y
# cualquier host que no sea www (importante: sin esto, el apex caía en el
# bloque www y entraba en bucle de redirección).
server {
    listen       80 default_server;
    listen  [::]:80 default_server;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # ── Cabeceras de seguridad ──────────────────────────────────────
    # `always` es imprescindible: sin él nginx NO las añade a las
    # respuestas de error (404/50x), que aquí son páginas propias.
    # TLS lo termina Dokploy/Traefik por delante; este bloque escucha
    # en :80, pero la cabecera viaja igual hasta el navegador.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
    # Sin Content-Security-Policy todavía: la web usa <style> y estilos
    # inline por todas partes y carga los iconos de integraciones desde
    # cdn.simpleicons.org — una CSP hay que probarla antes de activarla.

    # Páginas servidas tal cual; si no existe el recurso -> 404 personalizado.
    location / {
        try_files $uri $uri/ =404;
    }

    # Página de error 404 de Mazestudio (laberinto).
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Errores de servidor: usa la 50x.html que trae la imagen base de nginx.
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
    }
}

# Redirección canónica para SEO: solo www -> apex (301, conserva la ruta).
# NO es default_server, así solo actúa sobre el Host www.mazestudio.site.
server {
    listen       80;
    listen  [::]:80;
    server_name  www.mazestudio.site;
    return 301 https://mazestudio.site$request_uri;
}
