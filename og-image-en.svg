<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Mazestudio · AI consulting and integration">
  <defs>
    <radialGradient id="halo" cx="32%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#1a2a6e" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#0B0C10" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="thread" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8295F2"/>
      <stop offset="100%" stop-color="#4361F0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#0B0C10"/>
  <rect width="1200" height="630" fill="url(#halo)"/>

  <!-- hairline marco -->
  <rect x="40" y="40" width="1120" height="550" rx="22" fill="none" stroke="rgba(255,255,255,0.10)"/>

  <!-- marca: hilo del laberinto -->
  <g transform="translate(96,120) scale(2.0)">
    <path d="M3 44 L3 31 L19 31 L19 15 L33 15 L33 35 L47 35 L47 9 L61 9 L61 27 L75 27 L75 44 L129 44"
          fill="none" stroke="url(#thread)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="129" cy="44" r="6" fill="#4361F0"/>
  </g>

  <!-- wordmark -->
  <text x="96" y="360" font-family="'Space Grotesk', system-ui, sans-serif" font-size="104" font-weight="600" letter-spacing="-3" fill="#ECEDF2">Mazestudio<tspan fill="#4361F0">.</tspan></text>

  <!-- tagline · mismo texto que el og:title inglés (window.I18N_EN) -->
  <text x="100" y="430" font-family="'Space Grotesk', system-ui, sans-serif" font-size="40" font-weight="500" fill="#9498A8">AI consulting and integration</text>

  <!-- pie · el lema de marca tal y como lo dice la propia web en inglés -->
  <text x="100" y="540" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="22" letter-spacing="3" fill="#696D7C">OUT OF THE MAZE, A STRAIGHT LINE · TENERIFE</text>
</svg>
